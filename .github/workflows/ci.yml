# Build + Test
# Validates every contribution before merge

name: CI

on:
  push:
    branches: [next, feat/**, agent/**, research/**, hotfix/**]
  pull_request:
    branches: [main, next]
  merge_group:

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]
        python-version: [3.11]
        rust: [stable]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install JS deps
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Install Python deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Rust
        run: |
          if [ -f Cargo.toml ]; then cargo build --verbose; fi

      - name: Run Rust tests (default features)
        run: |
          if [ -f Cargo.toml ]; then cargo test --verbose; fi

      - name: Check telegram-cli builds with real-tdlib
        # The Telegram CLI (octo-telegram-onboard) is excluded from the main
        # workspace (see root Cargo.toml) to prevent TDLib's libc++ runtime
        # from leaking into every workspace test binary. We verify it still
        # compiles via the octo-cli-meta meta-crate's telegram-cli feature.
        run: |
          if [ -f Cargo.toml ]; then cargo check -p octo-cli-meta --features telegram-cli; fi

      - name: Clippy telegram-cli
        run: |
          if [ -f Cargo.toml ]; then cargo clippy -p octo-cli-meta --features telegram-cli --all-targets -- -D warnings; fi

      - name: Run JS tests
        run: |
          if [ -f package.json ]; then npm test || true; fi

      - name: Run Python tests
        run: |
          if [ -d tests ]; then pytest || true; fi
