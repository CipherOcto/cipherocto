# Build + Test
# Validates every contribution before merge

name: CI

on:
  push:
    branches: [next, feat/**, agent/**, research/**, hotfix/**]
  pull_request:
    branches: [main, next]
  merge_group:

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]
        python-version: [3.11]
        rust: [stable]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install system deps
        # libdbus-1-dev + pkg-config for bluer/dbus transitives pulled in by
        # octo-cable -> bluer -> dbus -> libdbus-sys. Without these, libdbus-sys'
        # build.rs panics with `explicit panic` (build fails before any crate
        # actually compiles).
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install scarb 2.16.0 (Cairo 2.x build orchestrator)
        # Required by `bundled_casm_hash()` in `crates/octo-wallet/src/capability/zk_mint.rs`
        # + `crates/zk-circuit/src/lib.rs`. The `OnceLock` `BUNDLED_CASM_CIRCUIT`
        # initializes on first test that calls `bundled_casm_hash()` (e.g., the
        # 11 zk_mint unit tests in `capability::zk_mint::tests`). Pre-9c996fba
        # the function was a stub (no scarb needed); post-9c996fba it shells
        # out to `scarb build` for the real CASM pipeline. Without scarb the
        # init fails with `CASM compiler internal error: scarb not in PATH`,
        # and all dependent tests panic.
        #
        # Pin matches `zk-capability-circuit.yml` `casm-snapshot` job: same
        # scarb 2.16.0 + cairo 2.16.0 + sierra 1.7.0 contract.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/install.sh | sh -s -- -v 2.16.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          scarb --version

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install JS deps
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Install Python deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Rust
        # Use `cargo check` (not `build`) — emits rmeta only, skips the link
        # step. The full workspace includes whatsapp_session_introspect and
        # similar heavy bins that link reqwest + hyper + rustls + aws-lc-rs,
        # which overflows the hosted runner's link-time RAM (SIGBUS in
        # collect2). `cargo test` still produces test binaries, but those
        # are smaller than standalone bins.
        run: |
          if [ -f Cargo.toml ]; then cargo check --verbose; fi

      - name: Run Rust tests (default features)
        # Exclude the Phase 7.J investigation binary
        # (whatsapp_chrome_reconnect_observer) and the two pure-binary
        # Chrome automation helpers (whatsapp_chrome_driver,
        # whatsapp_chrome_session_extract) from `cargo test`. None of
        # the three has a `tests/` integration directory — they are
        # `[[bin]]`-only crates whose link step pulls in
        # reqwest + hyper + rustls + aws-lc-rs and exhausts the
        # 7 GB hosted-runner RAM budget (collect2 SIGBUS at link time).
        # `cargo check` already validates they build (build step above).
        # The adapter crates that DO have integration tests
        # (octo-whatsapp, octo-adapter-telegram-mtproto, etc.) are
        # kept in the test surface and their `[[bin]]` test-mode link
        # is small enough to fit.
        run: |
          if [ -f Cargo.toml ]; then
            cargo test --verbose --workspace \
              --exclude whatsapp_chrome_reconnect_observer \
              --exclude whatsapp_chrome_driver \
              --exclude whatsapp_chrome_session_extract
          fi

      # NOTE: Tests behind --features query (Phase 8 query-layer +
      # Phase 7.K view_once/ephemeral) are skipped under default
      # features — they are gated on #[cfg(feature = "query")] so
      # the test functions don't exist unless the feature is on.
      # Running them on CI requires the full workspace build with
      # tantivy + candle + ... deps, which exceeds the hosted
      # runner's compile-time/link-time RAM budget. Run locally:
      #   cargo test -p octo-whatsapp --features query --lib
      # to exercise these on a developer machine.

      - name: Check telegram-cli builds with real-tdlib
        # The Telegram CLI (octo-telegram-onboard) is excluded from the main
        # workspace (see root Cargo.toml) to prevent TDLib's libc++ runtime
        # from leaking into every workspace test binary. We verify it still
        # compiles via the octo-cli-meta meta-crate's telegram-cli feature.
        run: |
          if [ -f Cargo.toml ]; then cargo check -p octo-cli-meta --features telegram-cli; fi

      - name: Clippy telegram-cli
        run: |
          if [ -f Cargo.toml ]; then cargo clippy -p octo-cli-meta --features telegram-cli --all-targets -- -D warnings; fi

      - name: Check whatsapp-cli builds via meta-crate
        # The WhatsApp CLI (octo-whatsapp) is excluded from the main workspace
        # by default and pulled in via the octo-cli-meta meta-crate's
        # whatsapp-cli feature. Pure-Rust, no TDLib pollution risk, but still
        # gated so unrelated downstream work doesn't break the workspace build.
        run: |
          if [ -f Cargo.toml ]; then cargo check -p octo-cli-meta --features whatsapp-cli; fi

      - name: Clippy whatsapp-cli
        run: |
          if [ -f Cargo.toml ]; then cargo clippy -p octo-cli-meta --features whatsapp-cli --all-targets -- -D warnings; fi

      - name: Run whatsapp-cli tests
        run: |
          if [ -f Cargo.toml ]; then cargo test -p octo-cli-meta --features whatsapp-cli; fi

      - name: Run JS tests
        run: |
          if [ -f package.json ]; then npm test || true; fi

      - name: Run Python tests
        run: |
          if [ -d tests ]; then pytest || true; fi
