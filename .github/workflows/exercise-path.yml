name: Exercise Path CI

# R15 fix: this workflow is pre-implementation scaffolding. Test targets
# (`--test eleven_step`, `--test exercise_goldens`, `--test cross_impl_verification`)
# do NOT have corresponding files under `crates/quota-router-core/tests/` until
# S04 mission 0957-b is implemented + claimed. Until then, this workflow is
# gated to not run on PRs (the `on: workflow_dispatch` trigger allows manual
# invocation once the test files exist). Per S04 plan §3 Step 6 + mission
# 0957-b Acceptance Criteria, the test files will be authored as part of the
# S04 mission claim work.

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [next]
  workflow_dispatch:

# 11-step exercise path CI for CipherOcto quota-router-core.
# References: docs/plans/2026-07-19-session-04-provider-boundary-exercise-path.md
#             missions/open/0957-b-provider-boundary-exercise-path.md
#             rfcs/draft/economics/0959-ask-settlement-chain.md (independent settlement chain)
#             rfcs/draft/economics/0957-capability-token-format.md (capability token substrate)

jobs:
  build:
    name: Build quota-router-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with all features
        run: cargo build -p quota-router-core --all-features

  test:
    name: 11-step exercise (AC-4)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run 11-step exercise under --all-features (provider-sim already included via --all-features)
        run: cargo test -p quota-router-core --test eleven_step --all-features

  body-scan:
    name: Body-field linter (mission In Scope item 3)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Body-scan for CapabilityToken-shaped strings in non-egress modules
        run: cargo run -p quota-router-cli -- body-scan --diff ${{ github.base_ref }}

  clippy:
    name: Clippy clean (AC-6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint with -D warnings (includes reqwest+hyper+ureq+isahc deny rules)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  exercise-goldens:
    name: Exercise goldens check (AC-5)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify INSTA goldens match
        run: cargo test -p quota-router-core --test exercise_goldens --all-features

  cross-impl:
    name: Cross-implementation verification (AC-10)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify RFC-0959 v1.0 TV1+TV2 settlement_hash + receipt_id digests match cross-impl reference
        run: cargo test -p quota-router-core --test cross_impl_verification --all-features

  fuzz-min:
    name: Fuzz capability_verify (5min minimum)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fuzz capability_verify for 5 minutes
        run: cargo fuzz run capability_verify -- -max_total_time=300