name: Exercise Path CI

# CipherOcto quota-router exercise path: 11-step canonical E2E test +
# mission-0957-b AC gates (AC-1 body-shape linter, AC-4 11-step,
# AC-5 goldens, AC-6 clippy, AC-9 zk-vectors, AC-10 cross-impl).
#
# Migration 2026-07-22 (e7032f94): workflow aligned to actual test files.
# Pre-fix targets `--test exercise_goldens`, `--test cross_impl_verification`
# and `cargo fuzz run capability_verify` referenced files/targets that
# never landed. Replaced with the real test + zk_vectors integration suites.
# cargo-fuzz binary remains TBD by mission 0958-a S05 task D; zk_vectors
# tests serve as the determinism gate until the fuzz harness ships.

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [next]
  workflow_dispatch:

# 11-step exercise path CI for CipherOcto quota-router-core.
# References: docs/plans/2026-07-19-session-04-provider-boundary-exercise-path.md
#             missions/open/0957-b-provider-boundary-exercise-path.md
#             rfcs/draft/economics/0959-ask-settlement-chain.md (independent settlement chain)
#             rfcs/draft/economics/0957-capability-token-format.md (capability token substrate)
#
# Feature gate note (per RFC-0917 invariant): `--all-features` is NOT used
# because `litellm-mode` and `any-llm-mode` are mutually exclusive
# (`compile_error!` at quota-router-core/src/router.rs:23). The mode gate
# controls PROVIDER STRATEGY (reqwest vs PyO3), not interface availability.
# BOTH HTTP proxy + Python SDK exist in ALL modes. `--features full`
# enables both strategies simultaneously (single build), which is the
# canonical "all strategies" form per RFC-0917.

jobs:
  build:
    name: Build quota-router-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with all features (--features full per RFC-0917 mutex)
        run: cargo build -p quota-router-core --features full

  test:
    name: 11-step exercise (AC-4)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run 11-step exercise under --features full (per RFC-0917 mutex; litellm-mode + any-llm-mode mutually exclusive)
        run: cargo test -p quota-router-core --test eleven_step --features full

  body-scan:
    name: Body-field linter (mission In Scope item 3)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run body-field linter via gating egress_boundary integration tests
        # Mission 0957-b AC-1 + RFC-0957 §Adversary A5 body-leakage defense.
        # Realized as the unit + regex assertion suite in
        # crates/quota-router-core/tests/egress_boundary.rs (HEX 64-char tag
        # detection + macaroon 3-segment base64url detection).
        run: cargo test --test egress_boundary -p quota-router-core --features full

  clippy:
    name: Clippy clean (AC-6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint with -D warnings (includes reqwest+hyper+ureq+isahc deny rules)
        run: cargo clippy --workspace --all-targets --features full -- -D warnings

  exercise-goldens:
    name: Exercise goldens check (AC-5)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify goldens match (RFC-0959 v1.0 settlement_hash + receipt_id check-ins)
        run: cargo test -p quota-router-core --test goldens --features full

  cross-impl:
    name: Cross-implementation verification (AC-10)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cross-impl ZK vectors (RFC-0958 §Test Vectors TV1+TV2 + RFC-0959 v1.0 settlement hash)
        run: cargo test -p quota-router-core --test zk_vectors --features full

  fuzz-min:
    name: Capability zk_vectors (AC-9 + AC-10 equivalent)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 8 RFC-0958 test vectors + RFC-0959 settlement hash replay defense
        # cargo-fuzz target `capability_verify` is NOT yet wired (TBD by
        # mission 0958-a S05 task D). For now, run zk_vectors + goldens
        # integration tests as the determinism gate.
        run: cargo test --test zk_vectors --test goldens -p quota-router-core --features full