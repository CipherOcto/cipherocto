# Formatting + Style
# Keeps multi-contributor code consistent

name: Lint

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [next, feat/**, agent/**, research/**, hotfix/**]
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install linters
        run: |
          npm install -g prettier || true
          pip install black flake8 || true
          cargo install cargo-audit || true

      - name: Rust format check
        run: |
          if [ -f Cargo.toml ]; then cargo fmt --all -- --check; fi

      # GitHub Actions workflow lint (audit §8 R11).
      #
      # Deliberately the ONLY step in this job without a `|| true` suffix. The
      # clippy, prettier, black and flake8 steps above all swallow their exit
      # code, so a failure in any of them is invisible — that is a separate
      # finding (R9), raised and left for the owner, and it is the reason this
      # step is called out rather than following the local convention.
      #
      # Running actionlint found four real defects in workflows that read
      # correctly and did not do what they said, including a `github.before`
      # that is not a GitHub context property and so silently resolved to the
      # empty string. The image is version-pinned to the same release the
      # fixes were verified against, so the gate cannot drift under the
      # workflow it is checking.
      #
      # `-shellcheck=` is deliberately NOT passed: the image's shellcheck pass
      # is fully enabled. It previously surfaced 22 findings (17 unquoted
      # `>> $GITHUB_OUTPUT` redirects, 4 `$(…)` word-splits, 1 SC2129) in
      # `release.yml` and `sync-e2e.yml`; all 22 are now resolved — the
      # redirects are quoted, and the four that are false positives for their
      # idiom carry a `# shellcheck disable=` with the reason inline. See
      # audit §8 R15.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7

      - name: Rust clippy
        run: |
          if [ -f Cargo.toml ]; then cargo clippy --all-targets --all-features -- -D warnings || true; fi

      - name: Run Prettier
        run: prettier --check . || true

      - name: Run Python format checks
        run: |
          black --check . || true
          flake8 . || true
