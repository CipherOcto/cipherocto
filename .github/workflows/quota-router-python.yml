name: Quota Router Python SDK

on:
  push:
    branches: [main, next, feat/*]
  pull_request:
    paths:
      - 'crates/quota-router-pyo3/**'
      - 'python/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # NOTE: actions/setup-python@v6's `virtual-environment` parameter
      # has been observed to silently fail to create the venv in some
      # cases, leaving subsequent `source .venv/bin/activate` steps with
      # "No such file or directory". We create the venv explicitly here
      # to make the failure mode visible and recoverable.
      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install maturin pytest

      - name: Build and install
        run: |
          source .venv/bin/activate
          # Maturin invokes `cargo build` under the hood and respects
          # `[tool.maturin].features` in `python/pyproject.toml`. We pin
          # `--no-default-features -F pyo3-extension-module -F full` here
          # so the build is robust to Cargo.toml default-feature drift:
          # default = ["full"] enables `quota-router-core/full` (correct)
          # BUT does NOT include `pyo3/extension-module`, so maturin's
          # manylinux check fails with "Your library links libpython".
          # Argument layout MUST stay on ONE line or use shell line
          # continuation: maturin passes trailing CLI args as positional
          # `cargo rustc` inputs and a `\`-escaped new line inserts a
          # leading-space + literal flag into the rustc argv, which cargo
          # then fails with "multiple input filenames provided".
          maturin develop --manifest-path crates/quota-router-pyo3/Cargo.toml --no-default-features -F pyo3-extension-module -F full

      # Install the user-facing Python package `quota_router` (in
      # python/). The native extension is installed as
      # `quota_router_native` by maturin (the wheel distribution
      # name is derived from the crate name `quota-router-pyo3`,
      # while the Python module name comes from the
      # `#[pymodule]` function in crates/quota-router-pyo3/src/lib.rs).
      # The Python package imports from `quota_router_native`.
      - name: Install Python package
        run: |
          source .venv/bin/activate
          pip install -e python/

      - name: Run smoke tests
        run: |
          source .venv/bin/activate
          python tests/smoke_test.py

      - name: Run pytest
        run: |
          source .venv/bin/activate
          pytest tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Install Rust explicitly. Without this, `maturin develop` below
      # tries to bootstrap its own rustc via rustup and fails on fresh
      # runners with:
      #   error: failed to install component: 'clippy-preview-x86_64-unknown-linux-gnu',
      #          detected conflict: 'bin/cargo-clippy'
      # The `test` job above has the same step and works; this job was
      # missing it. Pinning `dtolnay/rust-toolchain@stable` matches
      # the `test` job exactly and gives maturin a clean rustup to use.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # See note above on explicit venv creation.
      - name: Create venv and install mypy
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install mypy

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install maturin
          maturin develop --manifest-path crates/quota-router-pyo3/Cargo.toml --no-default-features -F pyo3-extension-module -F full
          # Install the user-facing Python package `quota_router`
          # so mypy can resolve `from quota_router_native import ...`
          # inside `python/quota_router/`.
          pip install -e python/

      - name: Type check
        run: |
          source .venv/bin/activate
          mypy python/quota_router

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # dtolnay/rust-toolchain defaults to `--profile minimal`, which
          # installs only rustc (no cargo, no clippy, no rustfmt). The
          # `test` and `type-check` jobs in this workflow happen to work
          # because their runners have cargo pre-installed in the Ubuntu
          # image. The `build` job hit a fresh runner without that, and
          # maturin failed with:
          #   error: 'cargo' is not installed for the toolchain '1.96.0-x86_64-unknown-linux-gnu'
          # Switching to `profile: default` installs cargo (and clippy,
          # rustfmt, rust-docs) explicitly via rustup, making the build
          # job self-sufficient regardless of the runner image.
          profile: default

      - name: Install maturin
        run: pip install --upgrade pip && pip install maturin

      - name: Build wheel
        run: maturin build --manifest-path crates/quota-router-pyo3/Cargo.toml --no-default-features -F pyo3-extension-module -F full
        env:
          MATURIN_PYTHON_TAGS: true

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: target/wheels/*.whl
