name: Quota Router

on:
  push:
    branches: [main, next, feat/**]
    paths:
      - "quota-router/**"
      - "octo-transport/**"
      - ".github/workflows/quota-router.yml"
  pull_request:
    branches: [main, next]
    paths:
      - "quota-router/**"
      - "octo-transport/**"
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quota-router

      # libdbus-1-dev + pkg-config for bluer/dbus transitives pulled in by
      # octo-cable -> bluer -> dbus -> libdbus-sys. Without these, libdbus-sys'
      # build.rs panics with "you may need to install dbus-1-dev". Same fix as
      # ci.yml + coverage.yml. Required so cargo build octo-transport succeeds.
      - name: Install system deps
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build octo-transport (dependency)
        working-directory: octo-transport
        run: cargo build

      - name: Run tests
        working-directory: quota-router
        run: cargo test --verbose

      - name: Clippy
        working-directory: quota-router
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        working-directory: quota-router
        run: cargo fmt --all -- --check

  clippy-stable:
    name: Clippy (stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quota-router

      - name: Install system deps
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Clippy
        working-directory: quota-router
        run: cargo clippy --all-targets --all-features -- -D warnings
