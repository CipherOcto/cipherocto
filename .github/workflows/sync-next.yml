# Sync main → next
#
# Keeps the `next` integration lane in sync with `main` after every push
# to main. This workflow opens a PR from main → next and auto-merges it
# if CI is green and there are no conflicts.
#
# Design notes (the previous version of this workflow force-reset
# `next` to `main` with `git checkout -B next origin/main` and
# `git push --force-with-lease`. That had two structural bugs:
# 1. The hard reset would lose any commits on `next` not on `main`
#    — for an integration lane with 1k+ unique commits, this would
#    silently discard work.
# 2. The force-push required the bot to bypass branch protection
#    (the repo requires PRs / merge queue for `next`), which is
#    why every run since 2026-02-25 has been failing.
#
# This rewrite fixes both:
# - Merge-commit strategy (no history rewrite; preserves the release
#   marker from the chore PR).
# - Goes through the PR route, NOT direct push to `next`. This
#   respects branch protection and avoids the force-push requirement.
# - Self-healing: if the sync PR has conflicts, the auto-merge fails
#   and a human sees an open PR. No silent data loss.
# - Idempotent: reuses an existing open sync PR; doesn't spam the
#   PR list with duplicates.
# - Concurrency-safe: the `concurrency` group prevents overlapping
#   runs from creating duplicate PRs.

name: Sync main to next

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitattributes'

# Prevent overlapping runs from creating duplicate sync PRs.
# cancel-in-progress: false — let in-progress runs complete (don't
# lose a half-finished sync just because main was pushed again).
concurrency:
  group: sync-main-to-next
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Skip if this was a release commit (the release workflow already
    # syncs via a different path, or the chore PR merge handles it).
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Detect gap
        id: gap
        run: |
          git fetch origin next
          BEHIND=$(git rev-list --count origin/next..origin/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Next is $BEHIND commits behind main"

      - name: Open or reuse sync PR
        id: sync-pr
        if: steps.gap.outputs.behind != '0'
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = 'main', base = 'next';
            // Reuse an existing open sync PR if one is already open.
            const { data: prs } = await github.rest.pulls.list({
              owner, repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });
            const existing = prs.find(pr => pr.title.startsWith('chore(sync):'));
            if (existing) {
              core.info(`Sync PR #${existing.number} already open — reusing`);
              core.setOutput('number', String(existing.number));
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo,
                title: 'chore(sync): merge main into next',
                head, base,
                body: [
                  '## Automated sync: main → next',
                  '',
                  'This PR is auto-generated by the `Sync main to next` workflow to keep the `next` integration lane in sync with `main`.',
                  '',
                  `- Behind by: **${{ steps.gap.outputs.behind }}** commits`,
                  '- Strategy: merge-commit (no history rewrite; preserves the release marker from the chore PR)',
                  '- Auto-merges if CI is green and no conflicts',
                  '',
                  'If this PR shows conflicts, resolve them manually and push to this branch — the auto-merge will retry.',
                ].join('\n'),
                maintainer_can_modify: true,
              });
              core.info(`Created sync PR #${pr.number}`);
              core.setOutput('number', String(pr.number));
            }

      - name: Enable auto-merge
        if: steps.gap.outputs.behind != '0'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.sync-pr.outputs.number }}
          merge-method: merge
