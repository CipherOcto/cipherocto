name: ZK Capability Circuit CI

# CipherOcto mission 0958-a (RFC-0958 §Test Vectors + wire format v2 + perf
# + fuzz + wholesale lint). Runs the cross-impl ZK vector suite, the wire v2
# round-trip tests, the CASM snapshot test, the no-wholesale-zk gate, and
# (nightly) the cargo-fuzz harness for 24h.
#
# References: rfcs/draft/economics/0958-zk-capability-subclass.md
#             missions/claimed/0958-a-zk-capability-circuit.md
#             docs/plans/2026-07-19-session-05-zk-capability-circuit.md
#
# Feature gate note (per RFC-0917 invariant): `--all-features` is NOT used
# because `litellm-mode` and `any-llm-mode` are mutually exclusive
# (`compile_error!` at quota-router-core/src/router.rs:23). Per Round 4
# review F-25 (2026-08-05): the prior `--features full` invocations were
# a phantom flag — mission 0958-b S2 (commit `77aff4aa`) REMOVED the
# `full` cargo feature from `crates/octo-wallet/Cargo.toml` +
# `crates/zk-circuit/Cargo.toml` in favor of runtime dispatch on
# `zk_vendor::vendor_state()`. The `--features full` flag now errors
# every build. All 6 invocations below were rewritten to drop the flag.
# Real-zk STWO selection happens at runtime via `libstwo_sys.so` presence;
# stub mode activates under `--features allow-stub-verifier` (test-only
# activation through `[dev-dependencies]` on `octo-wallet`, per R1 review
# F-1 closure).

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [next]
  # Nightly fuzz job (AC-13): runs cargo-fuzz for ~24h on a schedule; emits
  # results back to the workspace + opens a follow-up issue on crash findings.
  schedule:
    # 02:00 UTC daily, hitting ZK verifier for 24h-equivalent coverage.
    # The `fuzz-nightly` job self-imposes a 90-minute budget to stay within
    # the free tier cap; coverage is increased incrementally via code coverage
    # stats reported on each run.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: zk-capability-circuit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build cipherocto workspace (stable rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        # Same set as exercise-path.yml: libdbus-1-dev + pkg-config for
        # octo-cable -> bluer -> dbus transitive build.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build workspace (R4 F-25: dropped --features full phantom flag)
        run: cargo build --workspace

  zk-vectors:
    name: RFC-0958 test vectors (AC-4)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Run 8 RFC-0958 vectors + cross-impl TV1/TV2 (R4 F-25: dropped --features full)
        run: cargo test -p octo-wallet --test zk_vectors

  wire-v2:
    name: Wire format v2 round-trip (AC-8)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Run wire v2 4-segment round-trip (R4 F-25: dropped --features full)
        run: cargo test -p octo-wallet --test wire_v2_roundtrip

  casm-snapshot:
    name: CASM BLAKE3 snapshot (AC-2, mission 0958-a Session 2)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install scarb 2.16.0 (Cairo 2.x build orchestrator)
        # **Session 2 toolchain pin (2026-08-04):** scarb 2.16.0 / cairo 2.16.0 /
        # sierra 1.7.0. The standalone `cairo-compile` binary is gone in
        # Cairo 2.x — scarb is the only real compile route. The
        # `cairo-lang-sierra-to-casm 2.20.0` Rust crate (linked into
        # `zk-circuit`) consumes the scarb-emitted Sierra IR and lowers
        # it to CASM in-process.
        #
        # The session-1 install attempted `pip install cairo-lang==0.14.0.1`
        # for a standalone `cairo-compile` binary; that path is a Cairo
        # 1.x legacy and does NOT match the scarb 2.16.0 toolchain. Dropped.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/install.sh | sh -s -- -v 2.16.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          scarb --version
      - name: Run CASM BLAKE3 snapshot test (Sierra→CASM in-process pipeline)
        # Session 2 invariant: the smoke test exercises the full pipeline
        # end-to-end — scarb build → Sierra JSON → in-process
        # Sierra→CASM pass → BLAKE3 → 64-hex hash. Hard-fails (panics
        # with actionable message) if scarb is missing or the
        # Sierra→CASM pass fails. No silent skip, no stub fallback.
        run: cargo test -p zk-circuit --test casm_snapshot

  no-wholesale-zk:
    name: Wholesale ZK mint call-site linter (AC-5)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run layered defense linter
        # Fail-closed: any mint_with_zk call site outside the canonical
        # API file fails the build. Layered with the runtime gate
        # (permits_zk_mint) + the registry (Wholesale → V1 only).
        run: bash .github/linters/no-wholesale-zk.sh

  prod-gate:
    name: Production stub-verifier gate (AC-#1 R3 fix)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Release-build fail-closed gate
        # Mission 0958-a R3 review fix-up: BLAKE3 stub verifier is
        # forgeable by design. Production builds MUST return
        # StubDisabled when libstwo_sys.so is absent instead of
        # silently accepting a stub-shaped proof. The default
        # `allow-stub-verifier` feature is disabled here.
        run: cargo test -p zk-verifier --test stub_disabled --no-default-features

  perf-gates:
    name: Performance gates (AC-11 + AC-12)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Run #[ignore] perf gates (proof-gen <2s, verify <100ms, size 50-500KB)
        # Tagged `#[ignore]` so default `cargo test` does not run them; CI
        # opts in via `--include-ignored` to enforce the gates per PR.
        run: cargo test -p octo-wallet --test bench -- --include-ignored

  clippy:
    name: Clippy clean (AC-14)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Lint with -D warnings (R4 F-25: dropped --features full)
        run: cargo clippy --workspace --all-targets -- -D warnings

  fuzz-nightly:
    name: cargo-fuzz 24h on schedule (AC-13)
    runs-on: ubuntu-latest
    needs: build
    # Only run on schedule + workflow_dispatch; skip PRs to stay within the
    # 90-minute job cap (free tier). Real 24h coverage is achieved via
    # CORPUS accumulation across runs (cargo-fuzz resumes from the saved
    # corpus on disk).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      # Round 4 review F-27 (2026-08-05): `cargo fuzz run` requires the
      # nightly toolchain (uses `-Z` unstable flags). The build job uses
      # stable; this job installs nightly explicitly. Toolchain pin matches
      # the scarb 2.16.0 + cairo 2.16.0 + sierra 1.7.0 pin referenced in
      # the `casm-snapshot` job at line 90.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz (stable-compatible; pin a matching nightly)
        run: cargo install cargo-fuzz
      - name: Run capability_zk_verify fuzz for 1.5h CI budget
        # 24h total budget is split across runs in CI; cargo-fuzz resumes
        # from the saved corpus. 90-minute wall cap keeps the job inside
        # the free tier; PR reviewers see corpus growth + last coverage.
        run: |
          cargo fuzz run capability_zk_verify -p octo-wallet-fuzz \
              -- -max_total_time=5400 -max_len=4096
      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-capability-zk
          path: crates/octo-wallet/fuzz/corpus/capability_zk_verify
      - name: Report crash if any
        if: failure()
        run: |
          echo "FUZZ CRASH detected on ${{ github.sha }}" >&2
          echo "Inspect artifacts/fuzz-corpus-capability-zk/crash-*" >&2
          cargo fuzz list -p octo-wallet
