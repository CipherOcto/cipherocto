[workspace]
# ⚠️ quota-router-pyo3 is excluded: it enables quota-router-core/full which
# pulls pyo3 into the workspace feature unification graph, breaking link of
# crates that use the core library with default features (they end up needing
# libpython symbols). Build it standalone with:
#   cargo build -p quota-router-pyo3
#   maturin develop --manifest-path crates/quota-router-pyo3/Cargo.toml
#
# ⚠️ octo-telegram-onboard and octo-telegram-onboard-core are excluded:
# they activate the `real-tdlib` feature on `octo-adapter-telegram` (which
# pulls in TDLib, a ~150 MB C++ library, plus its `libc++` runtime at
# runtime). With feature unification, this would leak into every test
# binary in the workspace, breaking CI (no libc++ in ubuntu-latest).
# Build them via the `octo-cli-meta` meta-crate's feature flag:
#   cargo build -p octo-cli-meta --features telegram-cli
# Or directly:
#   cargo build --manifest-path crates/octo-telegram-onboard/Cargo.toml
members = ["crates/*"]
exclude = [
    "determin",
    "crates/quota-router-pyo3",
    "crates/octo-telegram-onboard",
    "crates/octo-telegram-onboard-core",
]
resolver = "2"

# ⚠️ CRITICAL INVARIANT (RFC-0917):
# Mode gate (litellm-mode/any-llm-mode/full) controls PROVIDER STRATEGY, NOT interface availability.
# BOTH HTTP proxy AND Python SDK exist in ALL modes:
#   - litellm-mode:  reqwest → provider REST APIs.    HTTP proxy ✅  Python SDK ✅
#   - any-llm-mode:  PyO3   → official Python SDKs.  HTTP proxy ✅  Python SDK ✅
#   - full:          Both reqwest AND PyO3.          HTTP proxy ✅  Python SDK ✅
#
# NEVER think "litellm-mode = proxy only" or "any-llm-mode = SDK only".
# See RFC-0917 lines 175-176: "HTTP Proxy Server | (always)" and "Python SDK Interface | (always)"
#
# Feature gates are defined in:
#   - crates/quota-router-core/Cargo.toml [features] section
#   - crates/quota-router-pyo3/Cargo.toml [features] section (via workspace inherits)

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CipherOcto"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# CLI parsing
clap = { version = "4.5", features = ["derive"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Networking (future libp2p integration)
libp2p = { version = "0.56", features = ["tokio", "noise", "tcp", "yamux"] }
# Local database (proto-blockchain state)
sled = "0.34"
# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }
# Cryptography
sha2 = "0.10"
blake3 = "1"
# Async traits
async-trait = "0.1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
anyhow = "1.0"
thiserror = "2.0"

# HTTP/HTTPS server
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
# TLS for HTTPS
rustls = "0.23"
rustls-pemfile = "2.1"
# HTTP client for forwarding
reqwest = { version = "0.13", features = ["json"] }
# Config file handling
directories = "6"
# Async mutex
parking_lot = "0.12"
# Random number generation
rand = "0.9"
# Gzip compression (mission 0850p-a-session-export)
flate2 = "1"
# Bitflags (mission 0855p-c-sub-admins SubAdminAuthority)
bitflags = "2"

# Patch a yanked transitive dep required by grammers-crypto
# 0.9.0 (used by octo-adapter-telegram-mtproto's grammers
# stack). `grammers-crypto 0.9.0` depends on
# `glass_pumpkin 1.10.0` which was yanked from crates.io.
# Tracked upstream: https://codeberg.org/Lonami/grammers
# (no other workspace crate uses glass_pumpkin).
#
# The fix: vendor a copy of `glass_pumpkin 2.0.0-rc0` (the
# next release) with the version field rewritten to
# 1.10.0. The API surface used by grammers-crypto
# (`safe_prime::check`) is identical between 1.10.0 and
# 2.0.0-rc0, so the version rewrite is API-compatible. See
# `vendor/glass_pumpkin/Cargo.toml` for the version-rewrite
# note.
[patch.crates-io]
glass_pumpkin = { path = "vendor/glass_pumpkin" }
