[package]
name = "capability_zk"
version = "0.1.0"
edition = "2024_07"

[cairo]
# NOTE: the former `target = "executable"` field is gone. scarb >= 2.20 warns
# `unknown manifest field 'cairo.target'` and never wired the executable
# plugin into `scarb build` anyway -- only `scarb execute` enables it.
#
# The executable wrapper is now produced where it is actually consumed:
# `crates/zk-circuit` calls `cairo_lang_executable::compile::compile_executable`
# against this crate, which requires `#[executable]` on `main` (see
# `main` in src/lib.cairo) and yields the wrapper + Standalone/Bootloader
# entrypoints that `stwo-sys` runs. See
# docs/zk/stwo-cairo-executable-recipe.md.
#
# Toolchain pin: scarb 2.20.0 / cairo 2.20.0, pinned by the repo-root
# .tool-versions. The compiled artifact at
# `target/dev/capability_zk.sierra.json` is deterministic across runs of
# the same scarb + source combination.
#
# Mission 0958-b S1: `cairo_test` dev-dep enables inline `#[test]`
# attributes for `scarb cairo-test`. Without it, scarb rejects
# the `#[test]` macro as "Unsupported attribute".

[dev-dependencies]
cairo_test = "=2.20.0"