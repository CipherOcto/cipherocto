[package]
name = "capability_zk"
version = "0.1.0"
edition = "2024_07"

[cairo]
# Executable (not lib): `main` takes the prover-supplied witness as
# parameters, which Cairo 2.16 only permits on an executable target. The
# emitted Sierra path is unchanged (`target/dev/capability_zk.sierra.json`),
# so crates/zk-circuit's in-process Sierra->CASM pipeline is unaffected.
target = "executable"

# Toolchain pin: scarb 2.16.0 / cairo 2.16.0.
# Cairo 1.x standalone `cairo-compile` binary does NOT exist; Cairo 2.x uses
# scarb as the build orchestrator. The compiled artifact at
# `target/dev/capability_zk.sierra.json` is deterministic across runs of
# the same scarb + source combination.
#
# Mission 0958-b S1: `cairo_test` dev-dep enables inline `#[test]`
# attributes for `scarb cairo-test`. Without it, scarb rejects the
# `#[test]` macro as "Unsupported attribute".

[dev-dependencies]
cairo_test = "=2.16.0"