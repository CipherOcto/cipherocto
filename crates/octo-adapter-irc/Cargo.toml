[package]
name = "octo-adapter-irc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "1.0"
blake3 = "1.5"
base64 = "0.22"
async-trait = "0.1"
tracing = { workspace = true }
octo-network = { path = "../octo-network" }
