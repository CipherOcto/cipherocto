[package]
name = "octo-adapter-matrix-sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Integration test feature — gates the `tests/integration_matrix.rs`
# test, which requires a running homeserver (started by
# `scripts/integration-matrix.sh up`). The feature is OFF by default
# so `cargo test` on a clean tree doesn't try to hit a homeserver.
integration-matrix = ["dep:octo-matrix-onboard-core"]

[dependencies]
# Matrix SDK (E2EE + SQLite crypto store, exact pin per 0850h-a SDK Risk note).
# Feature set is the corrected version of the mission 0850h-b spec:
# matrix-sdk 0.17.0 has no `rustls-tls` or `sqlite-cryptostore` features —
# TLS is baked into the embedded reqwest, and the SQLite crypto store is
# enabled implicitly when both `e2e-encryption` and `sqlite` are set. The
# `indexeddb-cryptostore` referenced in the mission does not exist in
# 0.17.0 either; the web-only state/event-cache store is the
# `indexeddb` feature (not used here — headless CLI).
matrix-sdk = { version = "=0.17.0", default-features = false, features = ["e2e-encryption", "sqlite", "qrcode"] }
# Async runtime (embedded for cdylib compatibility)
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# DOT encoding
blake3 = "1.5"
base64 = "0.22"
uuid = { version = "1.6", features = ["v4"] }
# Async trait
async-trait = "0.1"
# MIME types
mime = "0.3"
# DOT types (PlatformAdapter trait, envelope, domain, error)
octo-network = { path = "../octo-network" }
# Auth flows (only required for the integration-matrix feature; the
# production cdylib doesn't link to it).
octo-matrix-onboard-core = { path = "../octo-matrix-onboard-core", optional = true }
