[package]
name = "octo-adapter-p2p"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
blake3 = "1.5"
tracing = { workspace = true }
parking_lot = "0.12"
octo-network = { path = "../octo-network" }
# RFC-0009 AC#11: names the algorithm explicitly at the envelope-verification
# call site so the assumption is visible rather than implicit. Layer E
# per-algorithm extension — same edge the Layer B and C crates take.
octo-algo-ed25519 = { path = "../octo-algo-ed25519" }

# Native P2P (libp2p gossipsub)
libp2p = { version = "0.56", features = ["tokio", "noise", "tcp", "yamux", "gossipsub", "mdns", "identify", "macros"] }
futures = "0.3"
