[package]
name = "octo-adapter-quic"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
blake3 = "1.5"
tracing = { workspace = true }
octo-network = { path = "../octo-network" }

# QUIC transport (RFC 9000, RFC-0850 §8.7)
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"
