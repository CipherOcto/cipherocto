[package]
name = "octo-adapter-signal"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "process"] }
blake3 = "1.5"
base64 = "0.22"
async-trait = "0.1"
octo-network = { path = "../octo-network" }
