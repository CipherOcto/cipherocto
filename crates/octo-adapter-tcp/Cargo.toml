[package]
name = "octo-adapter-tcp"
version = "0.1.0"
edition = "2021"
description = "TCP transport adapter for CipherOcto DOT (RFC-0850 §8.8)"

[dependencies]
octo-network = { path = "../octo-network" }
# The envelope carries no algorithm, so a verifying adapter supplies it
# (RFC-0009 AC#11). DOT envelopes are signed with ed25519-dalek, so Ed25519
# is the algorithm this call site verifies under. This call site was stranded
# when the signature changed; `cargo clippy --all-targets` is what surfaced it,
# because the dispatch missions gated on `--lib` only.
octo-algo-ed25519 = { path = "../octo-algo-ed25519" }
async-trait = "0.1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }
blake3 = "1.5"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
ed25519-dalek = "2.2"
