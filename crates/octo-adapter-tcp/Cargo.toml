[package]
name = "octo-adapter-tcp"
version = "0.1.0"
edition = "2021"
description = "TCP transport adapter for CipherOcto DOT (RFC-0850 §8.8)"

[dependencies]
octo-network = { path = "../octo-network" }
octo-transport = { path = "../../octo-transport" }
async-trait = "0.1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }
blake3 = "1.5"
bincode = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "1"
