[package]
name = "octo-adapter-twitter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
blake3 = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
parking_lot = "0.12"
tracing = "0.1"

octo-network = { path = "../octo-network" }
# The envelope carries no algorithm, so a verifying adapter supplies it
# (RFC-0009 AC#11). DOT envelopes are signed with ed25519-dalek, so Ed25519
# is the algorithm this call site verifies under. Stranded by the
# `0009-c7` signature change, which moved the algorithm to first position;
# the AC-11 gate was edited to tolerate the bare form instead of
# requiring this argument, so nothing caught the fourteen of these.
octo-algo-ed25519 = { path = "../octo-algo-ed25519" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
