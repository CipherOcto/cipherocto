[package]
name = "octo-adapter-webhook"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync"] }
axum = "0.7"
blake3 = "1.5"
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
octo-network = { path = "../octo-network" }
