[package]
name = "octo-adapter-wechat"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
blake3 = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
parking_lot = "0.12"
tracing = "0.1"
aes = "0.8"
ecb = "0.2"

octo-network = { path = "../octo-network" }
# RFC-0009 AC#11: names the algorithm explicitly at the envelope-verify
# call site so the assumption is stated rather than implicit. Layer E
# per-algorithm extension — the same edge the other transport adapters take.
octo-algo-ed25519 = { path = "../octo-algo-ed25519" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
