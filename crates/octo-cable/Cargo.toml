[package]
name = "octo-cable"
version = "0.1.0"
edition = "2021"
description = "caBLE (Cloud Assisted BLE) hybrid authenticator transport for WebAuthn cross-device flows. Includes the FIDO:/<digits> QR codec, the HandshakeV2 bootstrap, and the QR-only relay transport."

[dependencies]
# CTAP2 canonical CBOR encoder/decoder. We construct maps by hand because
# CTAP2 requires canonical key ordering (sorted by key length then
# lexicographic), which ciborium's `Value::Map` representation does
# not guarantee — we sort ourselves before serializing.
ciborium = "0.2"
# Base64 for the FIDO:/ URI's secondary transports (some caBLE
# implementations use base64url instead of base10; we support both
# here even though the canonical Chromium encoding is base10).
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
# Round-trip testing only. No runtime dependency.
hex = "0.4"