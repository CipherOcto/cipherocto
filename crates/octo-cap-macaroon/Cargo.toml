[package]
name = "octo-cap-macaroon"
version = "0.1.0"
edition = "2021"
description = "Macaroon v1 capability substrate (RFC-0957 §3.1–3.2). Layer 4 extension crate; per RFC-0965 caveat discriminator pattern."
license = "MIT OR Apache-2.0"
authors = ["CipherOcto"]

[lib]
crate-type = ["rlib"]

[dependencies]
# BLAKE3 keyed-hash primitive (Layer A per RFC-0853 §1.1) — used for
# HMAC-BLAKE3 = blake3::keyed_hash per RFC-0957 §Algorithms.
blake3 = "1.5"
# hex for Debug redaction output (does NOT appear in wire form; safe).
hex = "0.4"
# Serde derives for Caveat + Macaroon + CapabilityCatalog (RFC-0126 canonical ser).
serde = { version = "1", features = ["derive"] }
# serde_json for `caveat::canonical_ser` JSON serialization (RFC-0126).
serde_json = "1"
# RNG for the 16-byte macaroon nonce (RFC-0957 §3.2 root_id derivation).
rand = "0.9"
# `#[async_trait]` for `CapabilityGossip::gossip_to_buyer` (mission 0959-c3).
async-trait = "0.1"
# thiserror for `MacaroonError` + `CatalogGossipError` derive.
thiserror = "1"
# RFC-0964 constraint encoding (used by `caveat::FactoryVet::pre_conditions`).
cipherocto-encoding = { path = "../cipherocto-encoding" }
# `octo-determin` (mission 0862-c9 RETIRED — local `MicroOctoW`
# alias killed project-wide per user mandate 2026-08-17): provides
# the canonical amount-bearing type `Dqa` (RFC-0862 v2.0.3 + RFC-0105
# §3) used directly across all amount-bearing caveat payload fields
# (`PaymentCaveat.budget`, `RateLimit.max_per_1k`, `Caveat::AmountMax`,
# `query_cost`, etc.). NO `MicroOctoW` re-exports exist in this
# crate — `Dqa` is the canonical type. Path dep used during local
# dev (the `determin` crate at repo root is workspace-excluded).
octo-determin = { git = "https://github.com/CipherOcto/cipherocto", branch = "next" }
# Layer B `HolderRegistry` accessor on `CapabilityCatalog` was REMOVED
# in Phase 2c-2 (mission 0957-ext-macaroon). The accessor had zero call
# sites (verified 2026-08-09 across workspace) so dropping it removes
# the cross-layer `quota-router-storage` dep without breaking any caller.
# Holder registry lookups are wired directly by downstream crates
# (`octo-wallet` uses `Arc<dyn HolderRegistry>` directly in verify.rs +
# gateway_authenticator.rs + audit_log.rs + federation.rs).
# Ed25519 signature type (CapabilityToken.holder_sig field).
ed25519-dalek = { version = "2.2", features = ["serde"] }
# base64 for capability token wire format encoding (RFC-0957 §3.7).
base64 = "0.22"
# Borsh derives for `caveat::PaymentCaveat` only (mission
# 0957-phase2b): the `PaidQueryRequest` envelope + the
# `MintRequest::payment_caveat` field both derive
# BorshSerialize/BorshDeserialize and embed `PaymentCaveat`. Adding
# borsh ONLY here (not on the rest of the macaroon substrate) keeps
# the coupling minimal — the canonical serde form remains the wire
# substrate for `Macaroon` / `CapabilityToken` / `Caveat` (RFC-0126
# + RFC-0957 §3.7). Borsh is required by the wallet-node + paid-query
# envelope layer (Layer C / Layer E) which sit above the substrate.
borsh = { version = "=1.5.0", features = ["derive"] }

[dev-dependencies]
# Property-based tests in `macaroon.rs` (`proptest!` macros).
proptest = "1"
# Test-only sample-DID helper used by `caveat.rs` + `macaroon.rs` tests.
octo-ident = { path = "../octo-ident" }
# Tokio for `CompositeCapabilityCatalog` async TV (mission 0959-c4).
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
# `missing_docs` is a rustc lint; the crate-level `#![allow(missing_docs)]`
# in src/lib.rs covers it. (Clippy's `missing_docs` lint doesn't exist —
# clippy reuses the rustc lint under the same name.)

[lints.clippy]
# Pedantic doc-comment style nits (empty lines after docs, doc list
# indentation) — original octo-wallet source was hand-written, not
# pedantic-style-compliant. Phase 2 keeps the substrate verbatim;
# a polish pass can normalize.
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"

