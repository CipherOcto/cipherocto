[package]
name = "octo-capability-issuer-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto capability-issuer specialized-node adapter (RFC-0871 §Roles and Authorities, mission 0871d Phase 3). Phase 3 MVP stub — CAPABILITY_ISSUE + CAPABILITY_REVOKE handlers; full macaroon substrate lands in mission 0957 Phase 2 follow-on."

[lib]
name = "octo_capability_issuer_node"
path = "src/lib.rs"

[dependencies]
# Layer 1 stable substrate (RFC-0871 §Data Structures)
octo-protocol = { path = "../octo-protocol" }
# Layer B identity + wallet core (RFC-0009 HsmAdapter, RFC-0957 macaroon)
octo-wallet = { path = "../octo-wallet" }
# Layer B identity (canonical DID codec, RFC-0010)
octo-ident = { path = "../octo-ident" }
# Layer 4 macaroon crypto foundation (RFC-0957 §3.1–3.2, mission 0957-ext-macaroon).
# Used for `MacaroonId` derivation (CAPABILITY_REVOKE token_id acceptance) and
# any future wire-form work. Phase 3 MVP only consumes the type alias.
octo-cap-macaroon = { path = "../octo-cap-macaroon" }
# Layer D transport adapter (RFC-0863 NodeTransport)
octo-transport = { path = "../../octo-transport" }

# Async runtime for NetworkReceiver impl + broadcast_announce
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
async-trait = "0.1"

# Canonical coding (RFC-0126)
borsh = "=1.5.0"
# bs58 for deriving public-key DID wire form (RFC-0010 v1.2 F4)
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

# Errors
thiserror = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Mission 0871d MVP — strict pedantic lints deferred to follow-on polish pass.
pedantic = "allow"
