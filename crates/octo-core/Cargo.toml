[package]
name = "octo-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
async-trait = "0.1"
tracing = "0.1"
anyhow = "1.0"
thiserror = "2.0"
blake3 = "1"

# `octo-registry` was declared here but referenced by nothing in this
# crate's source. octo-cli and octo-runtime both removed the same edge
# for the same reason; this one was missed. Removing it also drops the
# `sled` dependency the edge carried in, keeping the graph
# substrate-faithful per CLAUDE.md §Architectural Principles (Layer B
# substrate consumes only what it references).
