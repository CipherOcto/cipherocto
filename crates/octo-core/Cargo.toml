[package]
name = "octo-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
async-trait = "0.1"
tracing = "0.1"
anyhow = "1.0"
thiserror = "2.0"
blake3 = "1"

# Phase C: cipherocto-side migration runner + DAO over stoolap fork
# (consumer schema lives HERE, not in the fork; see memory [[stoolap-general-purpose-db]])
stoolap = { git = "https://github.com/CipherOcto/stoolap", branch = "feat/blockchain-sql" }

octo-registry = { path = "../octo-registry" }
