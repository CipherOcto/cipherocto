[package]
name = "octo-ident-storage"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Persistent DID registry adapter backed by CipherOcto's stoolap fork (RFC-0010 storage extension). Sole home of StoolapDidRegistry impl per RFC-0206 §Adapter Crate List row 3."

[lib]
name = "octo_ident_storage"
path = "src/lib.rs"

[dependencies]
# Layer A substrate (mission 0206-001). StoolapDidRegistry +
# StoolapHolderRegistry hold `octo_storage_core::Database`; constructor
# returns `Result<Database, SubstrateError>`.
octo-storage-core = { path = "../octo-storage-core" }

# Deterministic verification-method ids for the RFC-0009 BC#13 legacy
# migration. `v5` so a migrated key's id is `new_v5(MIGRATION_NAMESPACE,
# canonical_hash ‖ index)` — stable across `resolve` calls, processes and
# resolvers. Not `new_v4`: a random id per decode would make every signature
# over the signable prefix unverifiable, and RFC-0009 §Domain separation
# forbids deriving it from the public key.
uuid = { version = "1", features = ["v5"] }

# DidRegistry trait + DidDocument + ChainId + DidRegistryError types.
# Layer B (octo-ident owns the trait + shape types per RFC-0010).
# `borsh` feature required: `StoolapDidRegistry` borsh-encodes the
# 4 rich-document fields (mission 0010-f8-rich-did-storage); the
# derives on `ServiceEndpoint`/`ControllerReference`/`VerificationMethod`/
# `CapabilityDelegation` are gated behind `#[cfg_attr(feature = "borsh", ...)]`
# in octo-ident.
octo-ident = { path = "../octo-ident", features = ["borsh"] }

# Mission 0206-003 v3.0: HolderRegistry trait + RegistryError +
# Clock + HolderKind + HolderRecord + BearerCapsule types live in
# octo-cap-macaroon (Layer B). StoolapHolderRegistry impl uses them.
octo-cap-macaroon = { path = "../octo-cap-macaroon" }

# Layer B — sole home of `apply_pending` migration runner + the
# `did_registry` schema migrations (v008..v011). The StoolapDidRegistry
# constructor calls `migrations::apply_pending` to set up the table.
# Layer C → Layer B dep allowed per RFC-0957-A1 §Layer Discipline.
# Mission 0206-003 v3.0 R1 review: schema migrations STAY here
# (sole source of truth for `cipherocto_schema_version` tracker table)
# because the substrate's `apply_pending` skips migrations with
# version <= current DB version — a split catalog would silently
# skip quota-router's v001-v007 when octo-ident-storage had already
# bumped the DB to v011.
quota-router-storage = { path = "../quota-router-storage" }

# Borsh encoding for rich-document columns (mission 0010-f8-rich-did-storage).
borsh = { version = "=1.5.0", features = ["derive"] }

# Standard workspace deps.
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `octo-storage` facade for the per-adapter register_roundtrip fixture
# (RFC-0206 §Format Bypass Defense).
octo-storage = { path = "../octo-storage" }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"