[package]
name = "octo-ident"
version = "0.1.0"
edition = "2021"
description = "Canonical OctoID codec per RFC-0010 — translates between 52-byte raw storage form and W3C multibase-z wire form. Mission 0010-a."
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
# BLAKE3-256 per RFC-0853; used for DID hash + discriminator derivation
blake3 = "1.5"
# Display + Debug
thiserror = "1"
# Hex encoding for Debug formatting only (no wire form dependency).
hex = "0.4"
# Bitcoin base58btc encoder/decoder — RFC-0010 §Specification §raw_to_wire / §wire_to_raw
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
# async-trait for dyn-compatible async trait surface on `DidWriteCoordinator`
# (RFC-0862 v1.3 §DidWriteCoordinator). Used by the Layer B identity substrate
# to expose cross-instance write coordination as `Arc<dyn DidWriteCoordinator>`.
# async-trait for dyn-compatible async trait surface on `DidWriteCoordinator`
# (RFC-0862 v1.3 §DidWriteCoordinator) AND `ResolverBackend` (mission
# 0871b-cross-node-forwarding AC-1). Used by the Layer B identity substrate
# to expose cross-instance write coordination + per-hop resolution as
# `Arc<dyn Trait>`. Exact pin to 0.1.92 for matrix-sdk compatibility (the
# resolver-node Layer C crate pins the same version — matches workspace-wide
# pin per CL feedback "no parallel async-trait pins").
async-trait = "=0.1.92"

# NOTE: NO `octo-protocol = { path = "../octo-protocol" }` dep here — would
# close a Cargo cycle (`octo-protocol → octo-ident`). Layer B per-hop
# signature type (`RawHopSignature`) mirrors `octo_protocol::HopSignature`
# wire form byte-for-byte; the Layer-C handler converts via `From` at the
# wire boundary (Layer C → A is allowed).

[features]
default = []
# Enables long-running legacy-form parsing for environments still mid-migration.
# Per RFC-0010 §Specification §`parse` step 3, this gate flips off at Mission 0010-c.
allow-legacy-input = []
# Adds borsh Serialize/Deserialize impls for `WireDid` and `RawDid`. Required by
# RFC-0871 `NodeEnvelope` (Layer 1 envelope types embed `WireDid`). Off by
# default so Layer-1 codec stays minimal; `octo-protocol` enables it via its
# own feature flag.
borsh = ["dep:borsh"]

[dependencies.borsh]
version = "=1.5.0"
features = ["derive"]
optional = true

[dependencies.parking_lot]
# InMemoryDidRegistry uses parking_lot::RwLock for thread-safe HashMap.
# (Production deployments use StoolapDidRegistry in quota-router-storage;
# parking_lot here is the test/single-process convenience impl.)
version = "0.12"

[dev-dependencies]
# Test runtime for `#[tokio::test]` in write_coordinator module.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Borsh for the rich_did_document_tv round-trip tests. Re-uses the same
# version pinned in `[dependencies.borsh]` so the dev-dep serializes
# identically to what production consumers see.
borsh = { version = "=1.5.0", features = ["derive"] }

# The rich_did_document_tv suite exercises borsh round-trips on
# `octo_ident::DidDocument` + the rich document field types. Per
# `octo-identity-resolver-node/src/handlers/registration.rs` design
# intent ("keep `octo-ident::DidDocument` free of borsh derives" — the
# storage layer uses its own `RichDidDocument` mirror with borsh, not
# the canonical identity substrate), the canonical `DidDocument` derives
# are gated behind the `borsh` feature. The TV suite therefore requires
# the feature to be enabled at test compile time.
[[test]]
name = "rich_did_document_tv"
path = "tests/rich_did_document_tv.rs"
required-features = ["borsh"]
