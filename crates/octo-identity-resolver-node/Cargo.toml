[package]
name = "octo-identity-resolver-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto identity-resolver specialized-node adapter (RFC-0871 §Roles and Authorities). Bridges octo-ident DID codec to the NodeEnvelope mesh."

[lib]
name = "octo_identity_resolver_node"
path = "src/lib.rs"

[dependencies]
# Layer A core — RouterAnnouncePayload type (mission 0871e-phase5c)
quota-router-core = { path = "../quota-router-core" }
serde_json = "1"
# Layer 1 stable substrate (RFC-0871 §Data Structures)
octo-protocol = { path = "../octo-protocol" }
# Layer B identity (canonical DID codec, RFC-0010 v1.2 F4)
octo-ident = { path = "../octo-ident" }
# Layer D transport adapter (RFC-0863 NodeTransport)
octo-transport = { path = "../../octo-transport" }

# Async runtime for NetworkReceiver impl + broadcast_announce
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
async-trait = "0.1"

# Canonical coding (RFC-0126)
borsh = "=1.5.0"
# bs58 for deriving public-key DID wire form (RFC-0010 v1.2 F4)
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

# Errors
thiserror = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Mission 0871b MVP — strict pedantic lints deferred to follow-on polish pass.
pedantic = "allow"
