[package]
name = "octo-matrix-onboard-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Library half of octo-matrix-onboard: auth flows, session capture, QR rendering, OAuth callback listener."

[dependencies]
# Pinned to match the adapter; the SDK Risk note (mission 0850h-a)
# flags that an automatic patch bump to 0.x.y could break the QR
# module API. Upgraded from 0.17.0 → 0.18.0 in the 0850h-b SDK
# 0.18 extension; the upgrade is backward-compatible for the
# onboard-core API surface (Client::builder().restore_session()
# and ruma type imports unchanged). `rustls-tls` is NOT a valid
# 0.x feature; TLS is provided by the embedded reqwest's default
# backend (native-tls on Linux). `api` does not exist on 0.x —
# login APIs are unconditionally available.
matrix-sdk = { version = "=0.18.0", default-features = false }
# Async runtime
tokio = { workspace = true }
# Localhost OAuth callback listener (axum 0.7 is hyper-1 compatible)
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query"] }
# Terminal QR rendering (unicode half-block path)
qrcode = { version = "0.14", default-features = false }
# Logging
tracing = { workspace = true }
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
# URL parsing for OAuth callbacks
url = "2.5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3.8"
