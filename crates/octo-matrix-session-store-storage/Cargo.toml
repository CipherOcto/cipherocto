[package]
name = "octo-matrix-session-store-storage"
version = "0.1.0"
edition = "2021"
description = "Substrate adapter crate for octo-matrix-session-store (RFC-0206 §Adapter Crate List)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Layer A substrate (per RFC-0206 §Cargo.toml Cross-Cuts lines 333-338).
octo-storage-core = { path = "../octo-storage-core" }
# Owner crate — declares the `SessionStore` trait that this crate implements.
octo-matrix-session-store = { path = "../octo-matrix-session-store" }

[dev-dependencies]
octo-storage-core = { path = "../octo-storage-core" }