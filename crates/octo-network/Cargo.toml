[package]
name = "octo-network"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["sync", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
async-trait = "0.1"
thiserror = "2.0"
tracing = { workspace = true }

# DOT (RFC-0850) dependencies
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
libloading = "0.8"
wasmtime = { version = "28.0", optional = true }

# Native P2P (libp2p gossipsub)
libp2p = { version = "0.56", features = ["tokio", "noise", "tcp", "yamux", "gossipsub", "mdns", "identify", "macros"], optional = true }
futures = { version = "0.3", optional = true }

# QUIC transport (RFC 9000, RFC-0850 §8.7)
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
wasm = ["dep:wasmtime"]
native-p2p = ["dep:libp2p", "dep:futures"]
quic = ["dep:quinn", "dep:rustls", "dep:rustls-pemfile", "dep:rcgen"]
