[package]
name = "octo-policy-storage"
version = "0.1.0"
edition = "2021"
description = "Substrate adapter crate for octo-policy (RFC-0206 §Adapter Crate List)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Layer A substrate (per RFC-0206 §Cargo.toml Cross-Cuts lines 333-338).
octo-storage-core = { path = "../octo-storage-core" }
# Owner crate — declares the `PolicyStore` trait that this crate implements.
octo-policy = { path = "../octo-policy" }
# Layer A primitive (CLAUDE.md §Architectural Principles — crypto primitives
# stable, semver-major only). Required for constant-time BLAKE3 hash
# comparison in `PolicyRegistry::register_policy` so an attacker cannot
# mount a timing-side-channel to recover the expected 32-byte digest.
subtle = "2.6"
thiserror.workspace = true

[dev-dependencies]
octo-storage-core = { path = "../octo-storage-core" }