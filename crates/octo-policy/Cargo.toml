[package]
name = "octo-policy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Policy Object Graph: separable, versioned, shareable authorization policy (RFC-0967). Renamed from cipherocto-policy per RFC-0206 v2.1 §Adapter Crate List row 5."

[lib]
name = "octo_policy"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
blake3.workspace = true
hex.workspace = true
thiserror.workspace = true
cipherocto-encoding = { path = "../cipherocto-encoding" }
# Per-policy-kind UUIDv5 derivation (RFC-0967-A1 v1.9.2 §2.6)
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
