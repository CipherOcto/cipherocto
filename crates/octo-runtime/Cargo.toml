[package]
name = "octo-runtime"
version = "0.1.0"
edition = "2021"

# Mission `0011-c-octo-runtime-substrate` (RFC-0011-c §9.10 Substrate
# `[ADD]` Signatures; Layer B substrate-authoritative). Per
# [[cipherocto-design-principles]] §Layer direction, this crate is Layer
# B; consumed by Layer C/D `octo-cli` (one-way; no reverse dep).

[dependencies]
# Async runtime (Layer D transport substrate).
tokio = { version = "1.35", features = ["full"] }
# Async trait dispatch — Layer D transport substrate (RFC-0011 §Dependencies).
async-trait = "0.1"
# Envelope codec (Layer B; RFC-0011 §Output Envelope).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error enum derivation (Layer C/D operator envelope; substrate surfaces).
thiserror = "2.0"
# Typed UUID discriminator (RFC-0855 §Typed UUID discriminators).
uuid = { version = "1", features = ["v4", "serde"] }
# Timestamps (RFC-0011 §Output Envelope; substrate signatures).
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
# Tracing (Layer D transport substrate).
tracing = "0.1"
# BLAKE3 hash for canonical encoding integrity check (RFC-0011-c §F.1).
# Layer A primitive re-exported to encoding module.
blake3 = { version = "1", features = ["std"] }
# Hex encoding (Debug impls on `RuntimeHandle` + `RuntimeHandleBinding`
# session-id surface; mirrors the wallet substrate convention).
hex = "0.4"

# Layer B sibling crates.
octo-core = { path = "../octo-core" }
octo-registry = { path = "../octo-registry" }
# NEW: Layer B sibling edge per RFC-0011-c §F.5 sign_attach_handle_payload
# composition (octo_runtime → octo_wallet::identity::IdentityKey::sign).
octo-wallet = { path = "../octo-wallet", version = "0.1.0" }

[features]
# NEW: Stoolap cursor persistence feature flag per RFC-0011-c §F.3
# (gated on `dep:stoolap` to avoid pulling Stoolap into default builds).
default = []
octo-runtime-persistence = ["dep:stoolap"]

[dependencies.stoolap]
# CipherOcto fork per [[stoolap-fork-persistence]] (workspace pinned at rev 527e8eb).
# Conditional: only compiled when `octo-runtime-persistence` feature enabled.
optional = true
git = "https://github.com/cipherocto/stoolap"
rev = "527e8eb"
