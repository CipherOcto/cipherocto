[package]
name = "octo-settlement-core"
version = "0.1.0"
edition = "2021"
description = "Layer A frozen settlement substrate — Receipt + AskState + ReservationState + SettlementStore + AppendOnlyReceiptSink + chain helpers per RFC-0014 §Specification"
license = "Apache-2.0"
authors = ["CipherOcto"]

[lib]
crate-type = ["rlib"]

[dependencies]
# Layer A primitive: canonical serde for Receipt + Ask + Reservation +
# AskState + ReservationState.
serde = { version = "1", features = ["derive"] }
# Layer A primitive: BLAKE3-256 receipt chain hashing per RFC-0014
# §Design Goals G5 (mirrors RFC-0012 §Design Goals G5 for audit chain).
blake3 = "1.5"
# Layer A error type per cipherocto-design-principles Layer A row.
thiserror = "2.0"
# Router settlement-signature verification (Layer A, additive). RFC-0014
# §Threats assigns signature verification to the DOMAIN layer, so the frozen
# `verify_receipt_chain` does not do it — but no domain implemented the
# delegated check, and the zero-keyed receipt hash means anyone can forge a
# chain. `verify_receipt_chain_authenticated` supplies the missing primitive.
ed25519-dalek = "2.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"
