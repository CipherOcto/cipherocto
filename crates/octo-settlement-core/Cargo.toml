[package]
name = "octo-settlement-core"
version = "0.1.0"
edition = "2021"
description = "Layer A frozen settlement substrate — Receipt + AskState + ReservationState + SettlementStore + AppendOnlyReceiptSink + chain helpers per RFC-0014 §Specification"
license = "Apache-2.0"
authors = ["CipherOcto"]

[lib]
crate-type = ["rlib"]

[dependencies]
# Mission 0009-c2: the Layer B algorithm registry + the Ed25519
# `SignatureAlgorithm` implementation, so `verify_receipt_chain_authenticated`
# dispatches through `AlgorithmRegistry` instead of constructing a
# `VerifyingKey` inline (RFC-0009 AC#11). Layer E per-algorithm extension over
# Layer B; the arrow never points back.
octo-ident = { path = "../octo-ident" }
octo-algo-ed25519 = { path = "../octo-algo-ed25519" }

# Layer A primitive: canonical serde for Receipt + Ask + Reservation +
# AskState + ReservationState.
serde = { version = "1", features = ["derive"] }
# Layer A primitive: BLAKE3-256 receipt chain hashing per RFC-0014
# §Design Goals G5 (mirrors RFC-0012 §Design Goals G5 for audit chain).
blake3 = "1.5"
# Layer A error type per cipherocto-design-principles Layer A row.
thiserror = "2.0"
# Router settlement-signature verification (Layer A, additive). RFC-0014
# §Threats assigns signature verification to the DOMAIN layer, so the frozen
# `verify_receipt_chain` does not do it — but no domain implemented the
# delegated check, and the zero-keyed receipt hash means anyone can forge a
# chain. `verify_receipt_chain_authenticated` supplies the missing primitive.
ed25519-dalek = "2.2"

[dev-dependencies]
# Second registered algorithm (Layer A, RFC-0009 AC#11). Dev-only, and the
# reason is specific to this crate: `RouterKeyResolver` takes the key as a
# slice and names the algorithm beside it, so this is the only site in the
# crate where a resolver can actually express "this router speaks something
# other than Ed25519". Every other vector reaches verification through a
# 32-byte Ed25519 fixture and cannot tell dispatch from a hardcoded verifier —
# a stark-schnorr key is 33 bytes, which makes the difference observable.
# Dev-only because no production resolver speaks stark-schnorr; the vector
# exists to keep the site honest.
octo-algo-stark-schnorr = { path = "../octo-algo-stark-schnorr" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"
