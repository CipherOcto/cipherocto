[package]
name = "octo-storage-core"
version = "2.0.0"
edition = "2021"
description = "Layer A storage substrate — Database newtype + TypedStatement + AdapterAllowlist + pub mod stoolap re-export block (RFC-0206 v2.2 §Substrate Newtype Refactor + §Substrate Re-export Block)"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[features]
# Per RFC-0206 v2.1 §Implementation Phases 1.3: feature flags let adapter
# crates opt into the typed-query enforcement path explicitly. Default
# = `allow-listed-ddl` keeps the substrate on the existing migration
# runner path during the §Migration Order transition; `strict-typed-query`
# is the substrate redesign's load-bearing flag — it gates the typed
# `Database::execute_checked` path that enforces the per-adapter
# AdapterAllowlist.
default = ["allow-listed-ddl"]
allow-listed-ddl = []
strict-typed-query = []

[dependencies]
# Layer A → substrate SQL engine. Workspace-wide pin matches the audit
# (`docs/audits/stoolap-fork-stability-2026-08-16.md` — `Cargo.toml` root
# [patch.crates-io] block). Never bypass with a raw SQLite dep.
stoolap = { git = "https://github.com/CipherOcto/stoolap", branch = "feat/blockchain-sql" }
# Layer A error type per `cipherocto-design-principles` Layer A row.
thiserror = "2.0"
