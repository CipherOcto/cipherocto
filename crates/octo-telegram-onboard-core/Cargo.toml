[package]
name = "octo-telegram-onboard-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Library half of octo-telegram-onboard: TDLib auth flows, session extraction, config output."

[dependencies]
# Adapter auth module (UserAuth, AuthStateKey, AuthAction, AuthError).
# real-tdlib feature required for handle_authorization_state and decide.
octo-adapter-telegram = { path = "../octo-adapter-telegram", features = ["real-tdlib"] }
# TDLib Rust binding (direct calls for bot mode + get_me)
tdlib-rs = "=1.4.0"
# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
anyhow = "1.0"
thiserror = "2.0"
# Logging
tracing = { workspace = true }
# Memory zeroing for sensitive credentials
zeroize = { version = "1", features = ["zeroize_derive"] }
# Config dir resolution
dirs = "5"
# Atomic file writes
tempfile = "3.10"
# Base64 for verifying_key validation
base64 = "0.22"
# Hidden TTY input (2FA password via stdin with echo disabled)
rpassword = "7"
# Mutex (non-poisoning)
parking_lot = "0.12"
# QR-code generation for the qr-link subcommand. Same crate/version
# the whatsapp adapter uses (`crates/octo-adapter-whatsapp/src/adapter.rs`
# :299), so we don't add a new transitive dep graph.
qrcode = "0.14"

[dev-dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3.10"
