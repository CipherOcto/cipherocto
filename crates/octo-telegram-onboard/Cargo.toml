[package]
name = "octo-telegram-onboard"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone CLI that authenticates against Telegram via TDLib and writes a JSON config for octo-adapter-telegram."

[[bin]]
name = "octo-telegram-onboard"
path = "src/main.rs"

[dependencies]
# Library half — auth flows, session extraction, config output
octo-telegram-onboard-core = { path = "../octo-telegram-onboard-core" }
# CLI (env feature for reading env vars in clap args)
clap = { version = "4.5", features = ["derive", "env"] }
# Async runtime (explicit version because this crate is EXCLUDED from
# the workspace — see root Cargo.toml exclude list — so workspace
# inheritance via `workspace = true` does not apply)
tokio = { version = "1.35", features = ["full"] }
# Logging with redaction layer
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
anyhow = "1"
thiserror = "2"
# Heap-zeroing wrappers for secret material
zeroize = "1"
# Config dir resolution
dirs = "5"
# Atomic file writes
tempfile = "3.10"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base64 for verifying_key validation
base64 = "0.22"
# TDLib Rust binding (for whoami's direct get_me)
tdlib-rs = "=1.4.0"

[dev-dependencies]
tempfile = "3.10"
