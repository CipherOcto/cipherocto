[package]
name = "octo-vault-storage"
version = "0.1.0"
edition = "2021"
description = "Substrate adapter crate for octo-vault (RFC-0206 v2.1 §Adapter Crate List)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Layer A substrate (per RFC-0206 v2.1 §Cargo.toml Cross-Cuts lines 333-338).
octo-storage-core = { path = "../octo-storage-core" }
# Owner crate — declares the `VaultStore` trait that this crate implements.
octo-vault = { path = "../octo-vault" }

[dev-dependencies]
octo-storage-core = { path = "../octo-storage-core" }