[package]
name = "octo-wallet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto user-facing wallet: identity keys, capability key derivation, encrypted provider-key vault, starkli-compatible keystore"

[[bin]]
name = "octo-wallet"
path = "src/bin/octo-wallet.rs"

[lib]
name = "octo_wallet"
path = "src/lib.rs"

[features]
# **Mission 0958-b S2 (2026-08-05):** the `full` cargo feature was
# REMOVED. Real-zk STWO selection is now runtime (see
# `zk_vendor::loaded_library()`), not compile-time. The bench tests
# in `tests/bench.rs` exercise the dispatch path transparently:
# - When `libstwo_sys.so` is reachable (vendor state == Ffi), the
#   proof-size gate asserts 50-500KB and the latency gates measure
#   real STWO proof gen / verify.
# - When only the mock path is available (vendor state == Stub,
#   default dev/CI), the benches run structural smoke + assert
#   non-emptiness only — same behavior as before but no feature
#   gate required. Production deployments ship the cdylib alongside
# the binary.

[dependencies]
# Workspace deps — only what's needed for wallet MVP
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
directories.workspace = true
rand.workspace = true
serde_bytes = "0.11"

# ZK circuit (CASM compile, RFC-0958 Phase B.2; crypto home per [[stoolap-general-purpose-db]])
zk-circuit = { path = "../zk-circuit" }

# ZK canonicalization primitives (canonicalize_axes + ZKP_DOMAIN_PREFIX
# constants). R3 fix-up 2026-08-05: dropped the orphan `canonical_ser`
# symbol that was shipped in R2 but had zero non-test callers.
cipherocto-zkp-canonical = { path = "../cipherocto-zkp-canonical" }

# ZK verifier (Gap 3 / RFC-0958 + RFC-0962 §9 batch signature). Used at mint time
# to construct the canonical `zk_verifier::PublicInputs` the downstream
# verifier will reconstruct, so the proofer's mock commitment shape
# matches the verifier's stub_commitment check.
#
# **Mission 0958-b Round 1 review fix (2026-08-05, F-1):** the
# `allow-stub-verifier` feature is no longer enabled on the production
# dependency edge. Production `cargo build` of `octo-wallet` now
# activates the FFI fail-closed branch (`stub_commitment` returns
# `Err(ProverError::StubVerifierDisabled)` when `libstwo_sys.so` is
# absent). The feature is re-activated for the test suite below via a
# `dev-dependencies` re-export so `cargo test --features
# allow-stub-verifier` (or any `cargo test` that pulls the test-only
# feature) still has the BLAKE3 stub path available for the structural
# smoke tests + crypto-bypass detection in
# `tests/zk_vectors.rs::stub_proof_*`.
zk-verifier = { path = "../zk-verifier" }

# Storage types (Ask + AskRepository + SettlementEnvelope) for the
# `octo-wallet ask publish/list/show/revoke` CLI subcommand set
# (mission 0959-a §CLI surface).
quota-router-storage = { path = "../quota-router-storage" }

# Identity crypto (RFC-0009 §Identity Key Format)
ed25519-dalek = { version = "2.2", features = ["serde", "zeroize"] }
# Mission 0970-a1: X25519 ECDH + ChaCha20-Poly1305 encryption for
# `InnerRequest::ciphertext` (replaces BLAKE3 hash placeholder from 0970-a).
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
getrandom = "0.2"
hex = "0.4"
base64 = "0.22"

# Capability token (RFC-0957 §3)
borsh = { version = "1", optional = true }
# Mission 0957-a R6 fix: the optional `borsh` dep above was unused — the
# wire format actually uses serde_json (canonical JSON), per the new
# `wire::json_canon` module + naming alignment. Borsh may be re-enabled
# in a future RFC if a tighter canonicalization is adopted; until then
# the dep is removed to avoid carrying an unused surface.

# Federation delta wire format (RFC-0957-A1 §F1) — uses JSON (already in
# workspace deps). Bounded via length-prefixed encoding (see federation.rs).

# Typed Constraint substrate (RFC-0964) for Caveat::Factory pre_conditions
cipherocto-encoding = { path = "../cipherocto-encoding" }

# Policy Object Graph (RFC-0967) — subgraph check at redemption (Gap 1)
cipherocto-policy = { path = "../cipherocto-policy" }

# Vault encryption (RFC-0009 §Vault + RFC-0102 §Key Storage post-amendment)
argon2 = "0.5"
aes-gcm = "0.10"
# chacha20poly1305 reserved for Starkli keystore import (diverges from RFC-0102 §Key Storage; see mission §Starkli Keystore Divergence)
chacha20poly1305 = "0.10"

# Memory hygiene (RFC-0009 §Security Considerations: zeroize all secret-bearing types on drop)
zeroize = { version = "1", features = ["zeroize_derive"] }

# CLI (mission acceptance: octo-wallet subcommands)
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"

# Mission 0958-b S2 (2026-08-05): bench reads `zk_vendor::vendor_state()`
# to dispatch the AC-12 proof-size gate on whether the real-zk STWO FFI
# is loaded.
# Mission 0958-c AC-3 (2026-08-05): also a runtime dep — the wallet-side
# `ProofBundle.witness_format` field uses
# `zk_vendor::prover_input::WitnessFormat` so the enum is shared across
# proofer + verifier + wallet.
zk-vendor = { path = "../zk-vendor" }

# Mission 0959-c3: production `TransportDeliveryCatalog` wires
# `CapabilityCatalog::gossip_to_buyer` to the canonical RFC-0862
# gossip substrate (`octo_transport::NodeTransport::broadcast`).
octo-transport = { path = "../../octo-transport" }

# Mission 0959-c3: production wiring tests use tokio runtime to drive
# `octo_transport::NodeTransport::broadcast` (an async fn). Pulled
# in as a runtime dep because `gossip_envelope_to_buyer_async` in
# `gossip.rs` uses `tokio::time::sleep`.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# `async_trait` allows `CapabilityGossip::gossip_to_buyer` (an `async fn`
# in a trait) to be invoked through `&dyn CapabilityGossip` — required
# because Rust's native `async fn` in trait is not yet dyn-compatible.
# Mission 0959-c3. Runtime dep (not dev-dep) because the trait lives
# in library code (`crates/octo-wallet/src/capability/macaroon.rs`).
async-trait = "0.1"

# Mission 0010-d: AudienceId::from_str calls `CanonicalCodec::parse` to
# validate canonical DID shape at the wallet boundary (RFC-0010 v1.2 F4).
octo-ident = { path = "../octo-ident" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Mission 0957-a AC #10 (R6 fix): property test for 10K random monotonic
# caveat sequences.
proptest = "1"

# **Mission 0958-b Round 1 review fix (2026-08-05, F-1):** re-export
# `zk-verifier` with `allow-stub-verifier` enabled here so the
# integration tests (`tests/zk_vectors.rs`,
# `tests/capability_zk_acceptance.rs`, `tests/wire_v2_roundtrip.rs`)
# can still call `stub_commitment` / `stub_proof` under their `#[test]`
# bodies. Cargo's feature unification scopes dev-dependency features
# to `cargo test` invocations only — `cargo build` of the wallet
# library (and any downstream consumer that doesn't itself enable the
# feature) gets the FFI fail-closed branch. This restores the
# security rationale for S3 (`StubVerifierDisabled` returns Err on
# production builds) without breaking the test suite.
zk-verifier = { path = "../zk-verifier", features = ["allow-stub-verifier"] }

# Gap 3 / Task 3.4: eleven_step_zk.rs uses `verify_batch_capability_zk` +
# `CapabilityVerifier` from quota-router-core. Dev-dep only — production
# wallet code does not depend on quota-router-core (one-way dependency).
quota-router-core = { path = "../quota-router-core" }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Mission acceptance: clippy -D warnings clean across workspace
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
