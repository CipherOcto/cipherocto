[package]
name = "octo-whatsapp-onboard-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "octo_whatsapp_onboard_core"

[dependencies]
# Canonical filesystem permission primitives (H-7): the session export bundle
# carries the device Noise private key, so it is written 0600 from birth. Shared
# with the wallet and the CDP dump path so the rule has one definition.
cipherocto-fs-perms = { path = "../cipherocto-fs-perms" }
octo-adapter-whatsapp = { path = "../octo-adapter-whatsapp" }
octo-network = { path = "../octo-network" }
tokio = { version = "1", features = ["sync", "time", "fs", "rt-multi-thread", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
tempfile = "3"
# Mission 0850p-a-multi-account + 0850p-a-session-export
flate2 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
