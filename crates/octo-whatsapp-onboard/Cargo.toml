[package]
name = "octo-whatsapp-onboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "octo-whatsapp-onboard"
path = "src/main.rs"

[dependencies]
octo-whatsapp-onboard-core = { path = "../octo-whatsapp-onboard-core" }
octo-adapter-whatsapp = { path = "../octo-adapter-whatsapp" }
octo-network = { path = "../octo-network" }
# caBLE transport — used by the `companion-link` subcommand (Session 9).
octo-cable = { path = "../octo-cable" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dialoguer = "0.11"
dirs = "5"
futures = "0.3"
tempfile = "3"
thiserror = "1"
# rustls 0.23+ crypto provider — installed at the start of
# `companion-link` so TLS to `cable.ua5v.com` works without a
# compile-time feature flag.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
