[package]
name = "octo-whatsapp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Long-lived daemon for the WhatsApp adapter: owns the WebSocket, exposes JSON-RPC over unix socket, MCP over stdio, and a structured CLI."
publish = false

[[bin]]
name = "octo-whatsapp"
path = "src/main.rs"

[lib]
name = "octo_whatsapp"
path = "src/lib.rs"

[dependencies]
# Internal - adapter is the only thing we depend on for protocol; onboard-core
# is for delegation; network is for trait types only (we use them through the
# adapter); runtime is for the supervisor primitive if it exists.
octo-adapter-whatsapp      = { path = "../octo-adapter-whatsapp" }
octo-whatsapp-onboard-core = { path = "../octo-whatsapp-onboard-core" }
octo-network               = { path = "../octo-network" }

# Async + serialization
# Explicit pin because this crate is excluded from the workspace; workspace.dependencies does not apply.
tokio       = { version = "1.35", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
arc-swap    = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# DOT envelope encoding (RFC-0850 §8.6) and BLAKE3-256 domain hashing
base64 = "0.22"
blake3 = "1"

# CLI
clap        = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"

# Unix socket + SO_PEERCRED (Linux-only; we test on Linux only)
nix = { version = "0.29", features = ["fs", "socket", "uio", "feature", "process", "signal"] }

# Error mapping
thiserror = "1"
anyhow    = "1"

# Phase 4: rules engine, action dispatchers, audit hash chain
regex       = "1"
hex         = "0.4"
sha2        = "0.10"
subtle      = "2"
uuid        = { version = "1.6", features = ["v4", "serde"] }
landlock    = { version = "0.4", optional = true }                      # Linux-only sandbox
seccompiler = { version = "0.5", optional = true }                      # Linux-only sandbox

# Mutex used by the `MockAdapter` (compiled only under `test-helpers`)
# to track call counts and per-method canned responses.
parking_lot = { workspace = true }

# Token-rotation grace file persistence (Phase 5 Part A). Available
# in dev-dependencies too, but the lib needs it for `persist_grace` /
# `load_grace` even in non-test builds.
tempfile = "3"

[features]
default       = []
# Test helpers: enables the `MockAdapter` in `crate::test_mock_adapter`
# and `DaemonHandle::set_adapter_for_tests`. Off by default so neither
# the stub nor the test-only setter ships to consumers. Enable with:
#
#   cargo check -p octo-whatsapp --features test-helpers
#
# See `docs/plans/2026-07-05-whatsapp-runtime-cli-mcp-phase2.md` Phase A.
test-helpers = []
live-whatsapp = ["octo-adapter-whatsapp/live-whatsapp"]
landlock       = ["dep:landlock"]                          # Linux-only sandbox
seccomp        = ["dep:seccompiler"]                       # Linux-only sandbox

[dev-dependencies]
tempfile   = "3"
assert_cmd = "2"
predicates = "3"
tokio      = { version = "1.35", features = ["full", "test-util"] }
