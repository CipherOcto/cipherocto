[package]
name = "quota-router-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# ⚠️ CRITICAL INVARIANT (RFC-0917):
# Mode gate (litellm-mode/any-llm-mode/full) controls PROVIDER STRATEGY, NOT interface availability.
# BOTH HTTP proxy AND Python SDK exist in ALL modes.
# See quota-router-core/Cargo.toml for full invariant text.

[dependencies]
# Core library
quota-router-core = { path = "../quota-router-core" }
quota-router-sm-engine = { path = "../quota-router-sm-engine" }
# Storage types (SettlementEnvelope, ConsumedReceiptIndex, Ask, AskRepository)
# for `quota-router-cli settle` + `settle-replay` RPC-0959 §CLI subcommands.
quota-router-storage = { path = "../quota-router-storage" }
octo-reputation = { path = "../octo-reputation" }
octo-determin = { path = "../../determin" }
blake3.workspace = true

# Transport + adapter for mesh daemon
octo-transport = { path = "../../octo-transport" }
octo-adapter-tcp = { path = "../octo-adapter-tcp" }
octo-network = { path = "../octo-network" }

# Mission 0010-b: test fixtures use sample_did() from octo-ident test_helpers
octo-ident = { path = "../octo-ident" }

# Database
stoolap = { git = "https://github.com/CipherOcto/stoolap", branch = "feat/blockchain-sql" }

# CLI
clap.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true

# HTTP/HTTPS
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
reqwest.workspace = true

# Config
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"

# Utilities
uuid.workspace = true
parking_lot.workspace = true
hex = "0.4"

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Errors
anyhow.workspace = true
thiserror.workspace = true

[lib]
name = "quota_router_cli"
path = "src/lib.rs"

[[bin]]
name = "quota-router"
path = "src/main.rs"

[features]
# Mission 0010-b Phase F: enables the cipherocto-fork stoolap backend for
# `quota-router reputation-show --backend stoolap`. The CLI binary gates the
# stoolap code path behind this flag so a hermetic build (default) still
# compiles without the C++ dependencies that may be pulled in transitively.
# Production deploys must enable this feature.
stoolap = ["octo-reputation/stoolap"]
