[package]
name = "quota-router-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Async
tokio = { version = "1.35", features = ["full"], optional = true }
async-trait.workspace = true

# HTTP server (optional - enabled by litellm-mode/full)
hyper = { version = "1.3", features = ["full"], optional = true }
hyper-util = { version = "0.1", features = ["full"], optional = true }
http = { version = "1", optional = true }
http-body = { version = "1.0", optional = true }
http-body-util = { version = "0.1", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2.1", optional = true }
reqwest = { version = "0.13", features = ["json", "stream", "form"], optional = true }

# Config
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

# Utilities
uuid.workspace = true
parking_lot.workspace = true

# Random
rand.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# OpenTelemetry tracing (RFC-0905)
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["tonic", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }

# Errors
anyhow.workspace = true
thiserror.workspace = true

# Database
stoolap = { git = "https://github.com/CipherOcto/stoolap", branch = "feat/blockchain-sql" }

# RFC-0969 mission 0969-a: GatewayAuthenticator relocated from
# `octo-wallet::capability::gateway_authenticator` to
# `quota-router-core::ingress::authenticator`. The orchestrator imports
# `octo_wallet::capability::dispatch::*` (header parser substrate) +
# `octo_wallet::capability::macaroon::CapabilityCatalog` (catalog trait).
# Layer B → Layer B dependency (quota-router-core ↔ octo-wallet).
octo-wallet = { path = "../octo-wallet" }

# For HMAC-SHA256 key hashing
hmac-sha256 = "1.1"

# HMAC-SHA256 (used by webhook signing + AWS SigV4) is provided by the
# `hmac-sha256` 1.x crate, which has a self-contained no-deps impl and
# does not depend on the `hmac` crate. Routing through it avoids pulling
# a second `digest` major version into the dep tree, which would break
# under the ecosystem split between `digest 0.10` (sha2 0.10) and
# `digest 0.11` (hmac 0.13). See PR #57 for context.

# For bincode serialization (mesh envelope wire format)
bincode = "1"

# Mesh network layer dependencies (QuotaRouterNode, gossip, forward, handler)
octo-transport = { path = "../../octo-transport" }
octo-network = { path = "../octo-network" }
octo-core = { path = "../octo-core" }
octo-reputation = { path = "../octo-reputation" }
octo-ident = { path = "../octo-ident" }
# Mission 0870-b-envelope-adoption: NodeEnvelope + PayloadKindId +
# Authorization from RFC-0871 (Layer 1 stable substrate). Used by quota
# router outbound to wrap existing 0xC3–0xCB discriminator payloads in
# the unified `NodeEnvelope` envelope per RFC-0870 §NodeEnvelope Adoption.
octo-protocol = { path = "../octo-protocol" }
octo-determin = { path = "../../determin" }
quota-router-storage = { path = "../quota-router-storage" }
quota-router-sm-engine = { path = "../quota-router-sm-engine" }

# For SHA256 (used in event_id computation)
sha2.workspace = true

# For Ed25519 (S04 receipt signature + S05 ZK capability)
ed25519-dalek = { version = "2.2", features = ["serde"] }

# RFC-0871 §Data Structures: NodeEnvelope uses borsh-serialized wire
# form. Pulled in for the 0870-b envelope adoption (`envelope_v2.rs`)
# where `NodeEnvelope::build` round-trips via borsh.
borsh = "=1.5.0"
# RFC-0870 §NodeEnvelope Adoption: `signer_did` wire form
# `did:octo:z<base58btc(verifying_key)>` (see `envelope_v2.rs::node_canonical_did`).
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

# For BLAKE3 (used in tokenizer_id derivation)
blake3.workspace = true

# For hex encoding of key hashes
hex = "0.4"

# ZK capability crypto (RFC-0958; crypto home per [[stoolap-general-purpose-db]] 2026-07-22)
zk-circuit = { path = "../zk-circuit" }

# ZK canonicalization primitives (canonicalize_axes + ZKP_DOMAIN_PREFIX
# constants). R3 fix-up 2026-08-05: dropped the orphan `canonical_ser`
# symbol that was shipped in R2 but had zero non-test callers.
cipherocto-zkp-canonical = { path = "../cipherocto-zkp-canonical" }
zk-verifier = { path = "../zk-verifier", features = ["allow-stub-verifier"] }

# For constant-time comparison (master key bypass)
subtle = "2.6"

# For zeroizing SAML IdP cert / client_secret / scim_token on Drop
# (M4-saml-crypto-hygiene, findings F1-010 / F2-004)
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Prometheus metrics (RFC-0937)
prometheus = "0.14"

# For percent decoding (path normalization security)
percent-encoding = "2.1"

# For URL encoding (Vault KV v2 path encoding, RFC-0935)
urlencoding = "2.1"

# For token estimation (pre-call checks, RFC-0936)
tiktoken-rs = "0.6"

# For async streaming (futures::StreamExt)
futures-core = "0.3"
futures = "0.3"

# For timestamp handling (RFC-0905 structured logging)
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"

# For TokenBucket rate limiter (DashMap for concurrent access)
dashmap = "5.0"

# For monotonic time in TokenBucket
instant = "0.1"

# For L1 key cache LRU
lru = "0.12"

# For Unicode NFC normalization (provider/model normalization per RFC-0909 CONSISTENCY GOAL)
unicode-normalization = "0.1.25"

# HTTP framework (for litellm-mode)
axum = { version = "0.7", optional = true }

# Bytes (for streaming bodies)
bytes = { version = "1", optional = true }

# PyO3 (for any-llm-mode py_bridge module — calls official Python SDKs)
pyo3 = { version = "0.21", optional = true }
regex = "1.12.3"
base64 = "0.22.1"
quick-xml = { version = "0.40.1", features = ["serialize"] }
jsonwebtoken = { version = "10.4.0", features = ["rsa", "p256", "p384"] }
ring = "0.17.14"
rsa = "0.9.10"

[lib]
name = "quota_router_core"
path = "src/lib.rs"

[features]
# Feature gates per RFC-0917 §Rust Feature Gates
#
# ⚠️ CRITICAL INVARIANT (RFC-0917):
# Mode gate controls PROVIDER STRATEGY (reqwest vs PyO3), NOT interface availability.
# BOTH HTTP proxy AND Python SDK exist in ALL modes (litellm-mode, any-llm-mode, full).
#
# - litellm-mode:  reqwest (native Rust HTTP) → provider REST APIs. HTTP proxy ✅ Python SDK ✅
# - any-llm-mode:  PyO3 → official Python SDKs. HTTP proxy ✅ Python SDK ✅
# - full:          Both reqwest AND PyO3. HTTP proxy ✅ Python SDK ✅
#
# NEVER think "litellm-mode = proxy only" or "any-llm-mode = SDK only".
# The mode gate controls HOW providers are called, not WHETHER an interface exists.
#
# See RFC-0917 lines 175-176: "HTTP Proxy Server | (always)" and "Python SDK Interface | (always)"
default = ["litellm-mode"]
test-helpers = []
litellm-mode = ["tokio", "hyper", "hyper-util", "http", "http-body", "http-body-util", "rustls", "rustls-pemfile", "reqwest", "axum", "bytes"]
any-llm-mode = ["tokio", "hyper", "hyper-util", "http", "http-body", "http-body-util", "rustls", "rustls-pemfile", "reqwest", "axum", "pyo3", "bytes"]
full = ["tokio", "hyper", "hyper-util", "http", "http-body", "http-body-util", "rustls", "rustls-pemfile", "reqwest", "axum", "pyo3", "bytes"]

[[bench]]
name = "key_hash_storage_bench"
harness = false

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
cipherocto-encoding = { path = "../cipherocto-encoding" }
cipherocto-policy = { path = "../cipherocto-policy" }

# Mission 0958-b S2 (2026-08-05): zk_verify::capability tests gate
# on `zk_vendor::vendor_state()` to skip stub-shaped assertions when
# the real-zk FFI is loaded (R4 forgery-channel gate rejects
# stub-shaped proofs under FFI). Dev-dep only.
zk-vendor = { path = "../zk-vendor" }

# Mission marketplace-facade-reputation-async-migration: dual-read
# parity tests use `#[tokio::test]` to drive the async `ProviderReputationRegistryCompat`
# record_with_now / score path. The `full` feature of this crate already
# pulls in tokio at runtime; this dev-dep mirrors the same feature set
# for the test binary.
tokio = { version = "1.35", features = ["full"] }
