[package]
name = "quota-router-pyo3"
# NOTE: this crate is EXCLUDED from the workspace (see root Cargo.toml
# [workspace] section) because enabling `quota-router-core/full` pulls
# pyo3 into the workspace feature unification graph and breaks linking
# of other workspace members that use the core library with default
# features. As a result, this crate cannot use `*.workspace = true`
# inheritance — cargo errors with "failed to find a workspace root".
# All workspace-inherited values must be hardcoded here, mirroring the
# root `[workspace.package]` and `[workspace.dependencies]` tables.
# If you bump a version in the root workspace, you must also bump it
# here.
version = "0.1.0"
edition = "2021"
authors = ["CipherOcto"]
license = "MIT OR Apache-2.0"

# ⚠️ CRITICAL INVARIANT (RFC-0917):
# This crate provides the Python SDK interface.
# Mode gate (litellm-mode/any-llm-mode/full) controls PROVIDER STRATEGY, not interface availability.
# BOTH HTTP proxy AND Python SDK exist in ALL modes.
# - litellm-mode:  reqwest (native Rust HTTP) → provider REST APIs. HTTP proxy ✅ Python SDK ✅
# - any-llm-mode:  PyO3 → official Python SDKs. HTTP proxy ✅ Python SDK ✅
# - full:          Both reqwest AND PyO3. HTTP proxy ✅ Python SDK ✅
#
# See RFC-0917 §Rust Feature Gates.

[lib]
crate-type = ["cdylib", "rlib"]
# Lib name must MATCH the `#[pymodule]` function name in
# src/lib.rs exactly (`quota_router_native`). This makes pyo3
# emit the `PyInit_quota_router_native` init symbol, which is
# what maturin looks for. The Python module is importable as
# `quota_router_native` (top-level, no `_` prefix). The wheel
# distribution name is derived from the crate name
# (`quota-router-pyo3`), not from this lib name.
name = "quota_router_native"

[features]
# There are three feature constellations:
# - default = ["full"]: `cargo test --lib --features full` (or unset) runs
#   the rlib test path and links libpython. The lib's pyfunction call
#   sites work because `auto-initialize` is on.
# - `pyo3-extension-module`: produced as the additive feature passed by
#   maturin (via `python/pyproject.toml [tool.maturin].features = ["pyo3-extension-module"]`
#   AND explicitly via `-F pyo3-extension-module` in the CI workflow).
#   Activating this enables `pyo3/extension-module` which strips the
#   libpython link from the cdylib so maturin doesn't fail the
#   manylinux check with "Your library links libpython".
# - maturin's full wheel build uses
#   `--no-default-features -F pyo3-extension-module -F full` — see
#   `.github/workflows/quota-router-python.yml` — so the wheel gets
#   both `quota-router-core/full` (litellm + any-llm backends) AND
#   the extension-module flag. That's the only combo where cdylib
#   builds without libpython.
default = ["full"]
full = ["quota-router-core/full"]
pyo3-extension-module = ["pyo3/extension-module"]

[dependencies]
# PyO3 for Python bindings - using 0.21 with experimental async.
# `extension-module` is opt-in via the `pyo3-extension-module` feature so
# that `cargo test --lib` can run tests without Python's import loader.
# `auto-initialize` lets the rlib path spin up Python on demand (needed
# by `cargo test` since the test binary is NOT loaded by Python's import
# loader — maturin handles that path).
pyo3 = { version = "0.21", features = ["experimental-async", "auto-initialize"] }

# Core library - full mode enables both litellm (reqwest) and any-llm (PyO3) backends
quota-router-core = { path = "../quota-router-core", default-features = false, features = ["full"] }

# Serialization (hardcoded; see note above)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation (hardcoded; see note above)
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling (hardcoded; see note above)
thiserror = "2.0"

# Tokio for litellm-mode async runtime (hardcoded; see note above).
# "full" enables every tokio feature including "rt"; adding "rt"
# explicitly for clarity in the workspace-excluded context.
tokio = { version = "1.35", features = ["full", "rt"] }

# pyo3-asyncio for native async Python SDK calls (Phase 2)
pyo3-asyncio-0-21 = { version = "0.21", features = ["tokio-runtime"] }

# Lazy initialization for global state
once_cell = "1.19"

# Async trait support for implementing CallbackTarget from core callbacks module.
# Pin matches workspace version (root [workspace.dependencies]).
async-trait = "0.1"

# Structured logging (matches workspace version).
tracing = "0.1"

# Time handling for CallbackEvent construction in tests.
chrono = "0.4"

[build-dependencies]
pyo3-build-config = "0.21"
