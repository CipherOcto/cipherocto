[build-system]
requires = ["maturin>=1.5.0"]
build-backend = "maturin"

[project]
name = "quota-router"
version = "0.1.0"
description = "Drop-in replacement for LiteLLM with quota routing and cost management"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "CipherOcto", email = "dev@cipherocto.ai" }
]
keywords = ["llm", "ai", "quota", "router", "litellm", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/CipherOcto/cipherocto"
Repository = "https://github.com/CipherOcto/cipherocto"

[tool.maturin]
features = ["pyo3/extension-module"]
strip = true
