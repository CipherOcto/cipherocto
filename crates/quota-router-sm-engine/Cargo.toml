[package]
name = "quota-router-sm-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto quota-router settlement matching engine: owns the asks + consumed_receipt_index schema + state machine (Mint → Settled → Consumed). Stoolap (CipherOcto fork) is the embedded SQL substrate per [[stoolap-general-purpose-db]] Path B (cipherocto hosts schema; stoolap = general-purpose DB)."

[lib]
name = "quota_router_sm_engine"
path = "src/lib.rs"

[dependencies]
# CipherOcto fork of stoolap. Path-of-feature parity with current cipherocto
# workspace dep (see root Cargo.toml [patch.crates-io] for the git pin).
# Stoolap is the EMBEDDED SQL substrate; cipherocto owns schema + state machine.
#
# Per RFC-0206 v2.1 §Cargo.toml Cross-Cuts + HIGH 6 consumer-crate
# exemption, the substrate redesign v3.0 does NOT yet re-export
# `stoolap::ResultRow` / `stoolap::ApiTransaction` / `stoolap::Rows`
# / `stoolap::Error` — the settlement store decodes rows directly. A
# v2.2 RFC-0206 amendment (filed as 0206-011b) is the proper scope
# to add a `pub mod stoolap` re-export to the substrate. Until then,
# the direct dep stays.
stoolap = { git = "https://github.com/CipherOcto/stoolap", branch = "feat/blockchain-sql", features = ["sync"] }

# Layer A storage substrate (mission octo-storage-split S2). The migration
# runner that the historical `schema::apply_migrations` bundled is now
# re-exported from this substrate. Allowed by layer model: sm-engine
# (Layer C specialized node for settlement matching) depends on the
# Layer A substrate for the migration runner + DB constructors.
octo-storage-core = { path = "../octo-storage-core" }

# Workspace deps
blake3.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"], optional = true }

# Ed25519 signature substrate for ExecutionEnvelope (RFC-0962 §4 + RFC-0009 §Identity)
ed25519-dalek = { version = "2.2", features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true
# Mission 0010-b: test fixtures use sample_did() from octo-ident test_helpers
octo-ident = { path = "../octo-ident" }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Casts between i64/u64/u32 are intentional when bridging to stoolap's
# INTEGER columns; same as workspace-wide rule.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
implicit_clone = "allow"
map_unwrap_or = "allow"
