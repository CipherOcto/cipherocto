[package]
name = "quota-router-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cipherocto-side persistence for the quota-router domain (Ask + AskRepository + migrations + sync subscription). Owns consumer schema per [[stoolap-general-purpose-db]]; fork stays untouched."

[dependencies]
# Mission 0010-f8-rich-did-storage: borsh encoding for rich-document columns
# (matches `octo-ident/borsh` feature + the `CapabilityBundleV2` borsh
# precedent from mission 0957-f-v2-bundle).
borsh = { version = "=1.5.0", features = ["derive"] }
# Schema types + persistence — moved from octo-core 2026-07-21.
# Cipherocto owns consumer schema; fork is a general-purpose DB.
stoolap = { git = "https://github.com/CipherOcto/stoolap", branch = "feat/blockchain-sql" }

# Layer A storage substrate (mission octo-storage-split S2). The migration
# runner that the local `apply_pending` historically bundled is now
# re-exported from this substrate. Allowed by layer model: storage
# (Layer C specialized node for the quota-router domain) depends on
# the Layer A substrate for the migration runner + DB constructors.
octo-storage-core = { path = "../octo-storage-core" }

# Per the persistence convention (RFC-0914-a / 0914-a-stoolap-persistence):
# ALL new persistence uses CipherOcto's stoolap fork on
# `feat/blockchain-sql`, never raw SQLite. The crate API is
# `db.execute(sql, params)` and `db.query(sql, params) -> stoolap::Rows`.

# Hashing (BLAKE3 for AskId, settlement_hash, mission key derivation)
blake3 = "1"

# Ed25519 signature substrate (RFC-0959 §Algorithms `verify_ask`)
# Uses raw `SigningKey`/`Signature` so the storage crate stays decoupled from
# the higher-level `octo_wallet::identity::IdentityKey` wrapper (which pulls
# HSM/MPC/keystore). Callers convert at the boundary.
ed25519-dalek = { version = "2.2", features = ["serde"] }

# Serialization (rates_json column; model rates table)
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"

# Error types
thiserror = "2.0"

# TOML parser for the PricingAxis registry (RFC-0959 §Data Structures)
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[dependencies.octo-ident]
# Mission 0010-b: test fixtures use sample_did() from octo-ident test_helpers
# Mission 0871b-storage-backend: StoolapDidRegistry impl uses DidRegistry trait +
# DidDocument + DidRegistryError types defined in octo-ident. Production code dep
# (not dev-only) so consumers can construct trait objects without a dev-dep
# opt-in.
# Mission 0010-f8-rich-did-storage: enable `borsh` feature so the rich-document
# types (ServiceEndpoint, ControllerReference, VerificationMethod,
# CapabilityDelegation) expose their BorshSerialize/BorshDeserialize derives
# for column persistence.
path = "../octo-ident"
features = ["borsh"]

# S4 codemod (RFC-0105 DFP): replace u128 amounts with `Dqa` (deterministic
# floating-point). `Dqa` does not derive `Serialize`/`Deserialize` (per
# `determin/src/dqa.rs:104`), so we use `DqaEncoding`'s canonical 16-byte BE
# wire format via the manual impls in `crate::dqa_serde`. Arithmetic uses
# `Dqa`'s inherent methods (`add`/`multiply`/`compare`) returning `Result`.
# Git dep (not crates.io / path) to match the workspace-wide
# `octo-determin` version pulled in transitively by octo-vault /
# octo-storage-core — mixing path + git creates serde-traits-from-different-
# serde-crate errors (Dqa is local to octo-determin; its Serialize impl
# is from a specific serde version).
[dependencies.octo-determin]
git = "https://github.com/CipherOcto/cipherocto"
branch = "next"