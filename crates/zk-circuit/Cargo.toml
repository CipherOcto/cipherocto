[package]
name = "zk-circuit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto ZK circuit: compiles Cairo programs (RFC-0958 capability_zk) to CASM bytecode + BLAKE3 hash. Crypto home extracted from stoolap fork per [[stoolap-general-purpose-db]] (2026-07-22). Stable-rust only."

[lib]
name = "zk_circuit"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Deterministic serialization (RFC-0126)
# NOTE: will be wired once canonical_ser crate exists; for now use serde_json
# with a stable field order contract (sorted keys) — see hash() doc comment.
hex = "0.4"

# Tempfile for compile_from_source — writes Cairo source to a temp file
# before shelling out to `cairo-compile`. The Cairo compiler takes a file
# path, not stdin, so we need a path. tempfile is the standard for this.
tempfile = { workspace = true }

# Canonical proof commitment shape (Gap 3 / RFC-0958). Used by the
# mock proofer to emit commitment bytes that match the downstream
# verifier's `zk_verifier::stub_commitment` so the full mint -> verify
# round-trip exercises the canonical check.
zk-verifier = { path = "../zk-verifier" }

# Real STWO FFI (RFC-0958 capability ZK + RFC-0962 §9; Gap 3 Task 3.2). Only
# enabled when explicitly opted in — see zk-circuit::prove_batch_signature
# FFI branch. Default builds use the mock-prover path (deterministic
# BLAKE3 commitment), which preserves Class A determinism without
# requiring the nightly-only `libstwo_sys.so`.
zk-vendor = { path = "../zk-vendor", optional = true }

[features]
# Default OFF: build without the full dep. Mock prover handles all
# test vectors and the default 11-step ZK mint flow.
full = ["dep:zk-vendor"]

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
