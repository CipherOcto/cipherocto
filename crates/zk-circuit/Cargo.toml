[package]
name = "zk-circuit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto ZK circuit: compiles Cairo programs (RFC-0958 capability_zk) to CASM bytecode + BLAKE3 hash. Crypto home extracted from stoolap fork per [[stoolap-general-purpose-db]] (2026-07-22). Stable-rust only."

[lib]
name = "zk_circuit"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Deterministic serialization (RFC-0126)
# NOTE: will be wired once canonical_ser crate exists; for now use serde_json
# with a stable field order contract (sorted keys) — see hash() doc comment.
hex = "0.4"

# Tempfile for compile_from_source — `compile_source_inner` shells out to
# `scarb build` (Cairo 2.x build orchestrator) which writes the Sierra IR
# JSON inside `target_dir`. No cairo-compile subprocess (Cairo 1.x
# standalone binary is gone in Cairo 2.x). tempfile is needed for the
# per-call `--target-dir` directory we hand to scarb to keep parallel
# calls from clobbering each other's `target/dev/` output.
tempfile = { workspace = true }

# Cairo 2.x Sierra→CASM in-process pass (Session 2; mission 0958-a
# Phase B.2). `cairo_lang_compiler` is pulled in transitively via
# `cairo_lang_sierra` extensions + `ProgramRegistry` setup, but we
# list it explicitly here so the dependency graph is auditable from
# this Cargo.toml alone.
#
# Determinism contract: scarb produces Sierra IR JSON from the Cairo
# source; we parse it via serde, build a `Program`, construct the
# `ProgramRegistry::<CoreType, CoreLibfunc>`, compute AP-change
# metadata, lower to CASM via `compile`, and BLAKE3 the assembled
# bytecode. Same Cairo source → same Sierra IR (modulo salsa UUIDs
# which DO NOT affect the compiled CASM bytes) → same CASM bytes →
# same BLAKE3 hash. Class A determinism end-to-end.
cairo-lang-sierra = "=2.20.0"
cairo-lang-sierra-to-casm = "=2.20.0"
cairo-lang-compiler = "=2.20.0"
# Required transitively for `ProgramRegistryInfo` which is the input type
# to `calc_metadata_ap_change_only` and `compile`. Pulled in by
# `cairo-lang-sierra-to-casm` already; listed explicitly for auditability.
cairo-lang-sierra-type-size = "=2.20.0"

# BigInt for CASM bytecode serialization (felt252 → 32-byte BE encoding).
num-bigint = "0.4"

# Canonical proof commitment shape (Gap 3 / RFC-0958). Used by the
# mock proofer to emit commitment bytes that match the downstream
# verifier's `zk_verifier::stub_commitment` so the full mint -> verify
# round-trip exercises the canonical check.
zk-verifier = { path = "../zk-verifier" }

# Real STWO FFI (RFC-0958 capability ZK + RFC-0962 §9; Gap 3 Task 3.2). Only
# enabled when explicitly opted in — see zk-circuit::prove_batch_signature
# FFI branch. Default builds use the mock-prover path (deterministic
# BLAKE3 commitment), which preserves Class A determinism without
# requiring the nightly-only `libstwo_sys.so`.
zk-vendor = { path = "../zk-vendor", optional = true }

# ZK canonicalization primitives (canonicalize_axes + ZKP_DOMAIN_PREFIX
# constants). R3 fix-up 2026-08-05: dropped the orphan `canonical_ser`
# (zero non-test callers; consolidation deferred to mission 0958-b).
cipherocto-zkp-canonical = { path = "../cipherocto-zkp-canonical" }

[features]
# Default OFF: build without the full dep. Mock prover handles all
# test vectors and the default 11-step ZK mint flow.
full = ["dep:zk-vendor"]

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
