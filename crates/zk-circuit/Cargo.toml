[package]
name = "zk-circuit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto ZK circuit: compiles Cairo programs (RFC-0958 capability_zk) to CASM bytecode + BLAKE3 hash. Crypto home extracted from stoolap fork per [[stoolap-general-purpose-db]] (2026-07-22). Stable-rust only."

[lib]
name = "zk_circuit"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Deterministic serialization (RFC-0126)
# NOTE: will be wired once canonical_ser crate exists; for now use serde_json
# with a stable field order contract (sorted keys) — see hash() doc comment.
hex = "0.4"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
