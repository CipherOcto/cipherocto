[package]
name = "zk-vendor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto ZK vendor: vendored STWO source with stable-rust patches (curve25519 SIMD replacement). Cargo home for STWO, extracted from stoolap fork per [[stoolap-general-purpose-db]] (2026-07-22). MSRV pinned."

[lib]
name = "zk_vendor"
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
# FFI loading for stwo-sys cdylib. Decouples STWO upstream's nightly
# toolchain from the cipherocto workspace's stable-rust invariant —
# STWO is built as a separate cdylib (crates/zk-vendor/stwo-sys/) and
# loaded at runtime. See crates/zk-vendor/stwo-sys/README.md.
libloading = "0.8"

[dev-dependencies]

[lints.rust]
# `unsafe` is required for FFI loading (libloading, raw pointers,
# transmute). Each use has a SAFETY block. Non-FFI modules should
# remain unsafe-free.
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
