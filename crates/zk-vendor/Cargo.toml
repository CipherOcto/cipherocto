[package]
name = "zk-vendor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto ZK vendor: vendored STWO source with stable-rust patches (curve25519 SIMD replacement). Cargo home for STWO, extracted from stoolap fork per [[stoolap-general-purpose-db]] (2026-07-22). MSRV pinned."

[lib]
name = "zk_vendor"
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
