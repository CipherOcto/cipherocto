[package]
name = "zk-vendor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto ZK vendor: vendored STWO source with stable-rust patches (curve25519 SIMD replacement). Cargo home for STWO, extracted from stoolap fork per [[stoolap-general-purpose-db]] (2026-07-22). MSRV pinned."

[lib]
name = "zk_vendor"
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
# FFI loading for stwo-sys cdylib. Decouples STWO upstream's nightly
# toolchain from the cipherocto workspace's stable-rust invariant —
# STWO is built as a separate cdylib (crates/zk-vendor/stwo-sys/) and
# loaded at runtime. See crates/zk-vendor/stwo-sys/README.md.
libloading = "0.8"
# Vendored STWO source (in-workspace, stable-rust patched fork of
# keep-stwo/stwo v2.1.0). See crates/zk-vendor/stwo/ + PATCHES.md.
# Gated by the `vendored-stwo` feature so callers can opt in without
# pulling STWO into the default build.
stwo = { path = "./stwo", package = "stwo-vendored", optional = true }

[features]
# Default ON: in-workspace vendored STWO is enabled out of the box so
# `vendored_stwo()` returns Some(...) and `verify_capability_zk`
# delegates to it before falling back to the BLAKE3 stub. Disable with
# `default-features = false` if you need the stub-only path (e.g., to
# validate the BLAKE3 fallback in tests).
default = ["vendored-stwo"]
vendored-stwo = ["dep:stwo"]

[dev-dependencies]

[lints.rust]
# `unsafe` is required for FFI loading (libloading, raw pointers,
# transmute). Each use has a SAFETY block. Non-FFI modules should
# remain unsafe-free.
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
