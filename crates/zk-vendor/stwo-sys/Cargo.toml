[package]
name = "stwo-sys"
version = "0.1.0"
edition = "2021"
authors = ["CipherOcto"]
license = "MIT OR Apache-2.0"
description = "STWO STARK verifier FFI shim (CipherOcto zk-vendor libloading target)"
# This crate is INTENTIONALLY excluded from the cipherocto workspace
# (see root Cargo.toml `exclude`). It compiles against nightly toolchain
# (per rust-toolchain.toml) because STWO upstream pulls in curve25519-dalek
# nightly-only SIMD intrinsics. Cipherocto workspace stays stable-rust.

[lib]
name = "stwo_sys"
# cdylib = dynamically loadable shared library (.so/.dylib/.dll).
# Cipherocto zk-vendor dlopen()s this artifact via libloading.
crate-type = ["cdylib"]

[dependencies]
# Real STWO deps (matches stoolap/stwo-plugin/Cargo.toml pattern).
# These compile on nightly via per-crate rust-toolchain.toml. Cipherocto
# workspace stays stable; STWO is loaded at runtime via libloading from
# zk-vendor. See crates/zk-vendor/stwo-sys/README.md.
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo.git", tag = "v1.1.0" }
# Pin to exact version 2.1.0: stwo-cairo v1.1.0 was built against stwo 2.1.0;
# newer 2.x versions renamed FriConfig.line_fold_step → fold_step, breaking
# the cairo-serialize crate at compile time. Matches stoolap/stwo-plugin.
stwo = "=2.1.0"
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo.git", tag = "v1.1.0", package = "stwo-cairo-prover" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo.git", tag = "v1.1.0", package = "stwo-cairo-adapter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Decode the CASM bytecode hex carried by the program artifact. zk-circuit
# emits it; see CairoProgramSpec.
hex = "0.4"
thiserror = "1.0"

# Pin transitive deps to match stoolap/stwo-plugin/Cargo.lock resolutions:
# - ruint 1.17.2: newer ruint requires rustc 1.90+ which stabilizes
#   `iter_array_chunks` (breaking stwo 2.1.0's feature flag).
# - cairo-vm 3.1.0: newer cairo-vm removed `cairo_vm::stdlib::collections::HashMap`,
#   which stwo-cairo-adapter still imports.
ruint = "=1.17.2"
# `cairo-1-hints` selects cairo-vm's typed Cairo 1 hint processor. The
# builtin processor matches *legacy long-form pythonic* hint sources; the
# cairo-lang 2.20 renderer emits short canonical strings, so none of them
# resolve. Without this feature the harness fails with
# `UnknownHint("memory[ap + -1] = memory[ap + 0] < 4294967296")`.
cairo-vm = { version = "=3.1.0", features = ["cairo-1-hints"] }
# Typed CASM hints (`cairo_lang_casm::hints::Hint`) are what
# Cairo1HintProcessor executes. `serde` makes them (de)serializable so the
# hint table can cross the zk-circuit -> stwo-sys boundary. Pinned to the
# same version zk-circuit compiles with: the JSON representation is the
# cross-crate contract and both sides must render it identically.
cairo-lang-casm = { version = "=2.20.0", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
