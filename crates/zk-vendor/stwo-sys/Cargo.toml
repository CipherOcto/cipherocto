[package]
name = "stwo-sys"
version = "0.1.0"
edition = "2021"
authors = ["CipherOcto"]
license = "MIT OR Apache-2.0"
description = "STWO STARK verifier FFI shim (CipherOcto zk-vendor libloading target)"
# This crate is INTENTIONALLY excluded from the cipherocto workspace
# (see root Cargo.toml `exclude`). It compiles against nightly toolchain
# (per rust-toolchain.toml) because STWO upstream pulls in curve25519-dalek
# nightly-only SIMD intrinsics. Cipherocto workspace stays stable-rust.

[lib]
name = "stwo_sys"
# cdylib = dynamically loadable shared library (.so/.dylib/.dll).
# Cipherocto zk-vendor dlopen()s this artifact via libloading.
crate-type = ["cdylib"]

[dependencies]
# Real STWO deps. Version bumps (2026-10-07) are required, not cosmetic:
#
# - stwo-cairo v1.1.0 -> v1.3.0. v1.1.0 pins `cairo-vm = "3.0.0"` and
#   re-exports `cairo_vm::stdlib::collections::HashMap`, a module cairo-vm
#   3.2.0 DELETED. That is what forced the 3.1.0 pin below. v1.3.0 replaced
#   that re-export with `use std::collections::HashMap` and pins cairo-vm
#   3.2.0, so the pin is no longer load-bearing. Also moves stwo 2.1.0 ->
#   2.3.0 and adds starknet-types-core 0.2.4.
# - cairo-vm 3.1.0 -> 3.2.0. Adds the `cairo_run` module used by this crate
#   and makes `final_pc` public.
#
# See docs/architecture/zk-stwo-cairo-executable-recipe.md.
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo.git", tag = "v1.3.0" }
stwo = "=2.3.0"
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo.git", tag = "v1.3.0", package = "stwo-cairo-prover" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo.git", tag = "v1.3.0", package = "stwo-cairo-adapter" }
# `PublicSegmentContext` is re-exported here, and the prover needs
# `PreProcessedTraceVariant` for `ProverParameters`.
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo.git", tag = "v1.3.0", package = "stwo-cairo-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"

# Pin transitive deps to match stwo-cairo v1.3.0's own Cargo.lock:
# ruint 1.17.2 — newer ruint requires a rustc new enough that
# `iter_array_chunks` is stabilised, which breaks stwo's `#![feature]`.
ruint = "=1.17.2"
# `cairo-1-hints` selects cairo-vm's typed Cairo 1 hint processor. The
# builtin processor matches *legacy long-form pythonic* hint sources; the
# cairo-lang 2.20 renderer emits short canonical strings, so none of them
# resolve. Without this feature the harness fails with
# `UnknownHint("memory[ap + -1] = memory[ap + 0] < 4294967296")`.
cairo-vm = { version = "=3.2.0", features = ["cairo-1-hints"] }

# The Cairo executable ABI. `cairo_lang_executable` provides the upstream
# `Executable` type that is the program artifact; `cairo_lang_runner`
# provides `build_hints_dict` / `CairoHintProcessor`, which is how the
# circuit's arguments reach the VM (as calldata through hints, NOT on the
# stack). Pinned to 2.20.0 — the same version zk-circuit compiles with:
# `Executable` round-trips through serde and is the cross-crate contract.
cairo-lang-executable = "=2.20.0"
cairo-lang-runner = "=2.20.0"
cairo-lang-utils = "=2.20.0"
cairo-lang-casm = { version = "=2.20.0", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1