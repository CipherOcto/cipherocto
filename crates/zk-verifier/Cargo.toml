[package]
name = "zk-verifier"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto ZK verifier: STWO STARK Fiat-Shamir proof verification. Crypto home extracted from stoolap fork per [[stoolap-general-purpose-db]] (2026-07-22). Stable-rust only."

[lib]
name = "zk_verifier"
path = "src/lib.rs"

[features]
# **Mission 0958-a R3 review fix-up (2026-07-31):** the BLAKE3 stub
# verifier path is forgeable by design (commitment is computable from
# publicly-known inputs). To prevent accidentally shipping a release
# build that accepts stub-shaped proofs, the stub path is gated behind
# this opt-in feature. CI / dev (`cargo test`, `cargo build`) get the
# feature enabled by default. Production must explicitly disable
# defaults (`cargo build --no-default-features`) AND either ship
# `libstwo_sys.so` alongside the binary or set
# CIPHEROCTO_ALLOW_STUB_VERIFIER=1 in the deploy environment if
# dev-mode stub verification is genuinely needed.
default = ["allow-stub-verifier"]
allow-stub-verifier = []  # cipherocto-internal dev flag; document in dev guide

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true
hex = "0.4"
# STWO runtime loader (libloading into `libstwo_sys.so` produced by
# crates/zk-vendor/stwo-sys/). Falls back to stub when lib missing.
zk-vendor = { path = "../zk-vendor" }

# STWO is vendored under `zk-vendor/` (NOT a crates.io dep). Stubbed below
# until the source drop + curve25519 patches land in zk-vendor.
# zk-vendor = { path = "../zk-vendor" }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
