[package]
name = "zk-verifier"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CipherOcto ZK verifier: STWO STARK Fiat-Shamir proof verification. Crypto home extracted from stoolap fork per [[stoolap-general-purpose-db]] (2026-07-22). Stable-rust only."

[lib]
name = "zk_verifier"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true
hex = "0.4"
# STWO runtime loader (libloading into `libstwo_sys.so` produced by
# crates/zk-vendor/stwo-sys/). Falls back to stub when lib missing.
zk-vendor = { path = "../zk-vendor" }

# STWO is vendored under `zk-vendor/` (NOT a crates.io dep). Stubbed below
# until the source drop + curve25519 patches land in zk-vendor.
# zk-vendor = { path = "../zk-vendor" }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
