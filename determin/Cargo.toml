[workspace]
members = ["cli"]

[package]
name = "octo-determin"
version = "0.1.0"
edition = "2021"
description = "Deterministic Floating-Point (DFP) implementation for CipherOcto"

# Per RFC-0104: Compiler flags for deterministic execution
[profile.release]
# Overflow checks are OFF by default in release - REQUIRED for DFP
# Do NOT set overflow-checks = true, as it would break saturating arithmetic
# Note: We use saturating_add/sub/mul explicitly in code where needed

# LTO disabled for faster builds - can enable for production
# lto = "thin"

[profile.bench]
# Bench uses release flags
inherits = "release"

# Test profile - use release for DFP determinism
# Run with: cargo test --profile test
[profile.test]
inherits = "release"

# Fuzz profile - use release for performance and DFP determinism
# Run with: cargo fuzz --profile fuzz
[profile.fuzz]
inherits = "release"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
# Borsh wire form for `Dqa` (RFC-0105 §Canonical Encoding; mission
# 0862-c9-c9 — additive Layer A change shipping `BorshSerialize` /
# `BorshDeserialize` on `Dqa` so wallet-node envelopes can return
# to the borsh wire form after the 0862-c9-RETIRED kill of the
# `MicroOctoW` alias). Encoding reuses the canonical 16-byte BE
# `DqaEncoding` shape (value: 8B BE + scale: 1B + _reserved: 7B).
# Pin matches the wallet-node + cap-macaroon envelope pin.
borsh = { version = "=1.5.0", features = ["derive"] }

[features]
default = []
non_consensus = []
# Use internal bigint instead of num-bigint for DECIMAL arithmetic
# When enabled, decimal_internal.rs is used; otherwise decimal.rs (num-bigint) is used
use-internal-bigint = []

[dev-dependencies]
proptest = "1.4"
rand = "0.8"
criterion = "0.5"

# softfloat-rs v0.1.0 build.rs is missing a SPECIALIZED_PATH constant for
# target_arch values other than those it explicitly supports (arm-vfpv2, riscv,
# 8086-SSE, x86-SSE, etc.). It fails to compile on macOS (aarch64-apple-darwin)
# and on Windows MSVC (which additionally rejects the `__int128` extension used
# by the underlying berkeley-softfloat-3 C sources). softfloat-rs is only used
# for differential fuzzing against the Berkeley SoftFloat reference, so we
# restrict it to linux; the in-tree DFP float implementation in `octo-determin`
# does not depend on it and is exercised by the rest of the test suite on all
# platforms.
[target.'cfg(target_os = "linux")'.dev-dependencies]
softfloat-rs = "0.1"

[[bench]]
name = "decimal_benchmark"
harness = false

[lib]
name = "octo_determin"
path = "src/lib.rs"

[[bin]]
name = "generate_lut"
path = "bin/generate_lut.rs"
