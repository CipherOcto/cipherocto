[workspace]

[package]
name = "quota-router"
version = "0.1.0"
edition = "2021"
description = "Distributed quota router network for CipherOcto (RFC-0870)"
license = "Apache-2.0"

# This package has no src/. Commit 616fe433 migrated the mesh layer to
# crates/quota-router-core/ (canonical home), so its only cargo targets are
# the two integration tests under tests/, and they reach the code through
# the quota-router-core dev-dependency below.
#
# The whole [dependencies] block that migration left behind has been removed.
# Every entry in it was unreferenced across tests/, and building octo-network,
# reqwest, prometheus and bincode for two test files that use none of them is
# pure CI cost. Anything this package needs to build goes in
# [dev-dependencies], where its tests can actually reach it.

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "rt-multi-thread"] }
proptest = "1"
# The adversarial integration tests were written when the mesh layer lived
# in this package's src/. Commit 616fe433 migrated the source to
# crates/quota-router-core/ (canonical home). Add the migrated crate as a
# dev-dependency so the tests can keep validating the 0870h acceptance
# criteria against the new location.
quota-router-core = { path = "../crates/quota-router-core" }
