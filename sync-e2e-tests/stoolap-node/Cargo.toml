# Standalone workspace, matching `sync-e2e-tests` and `live-tests`.
#
# `sync-e2e-tests/Cargo.toml` declares a `[workspace]` table and does not list
# this package as a member, so cargo refused to resolve anything in this
# directory at all. That broke the `Build stoolap-node` step in both the
# `l3-in-process` and `l4-cross-process` jobs of `sync-e2e.yml`.
#
# It was introduced by commit `7ef1363c` ("fix(workspace): project-wide clippy
# + fmt clean", 2026-07-16), which added the parent `[workspace]` table. Before
# it, this directory resolved as its own package because the root manifest
# excluded `sync-e2e-tests`. The workflow is `workflow_dispatch` only, so the
# breakage went unseen for about three months.
#
# This package is built independently — the workflow builds it from this
# directory and then runs the test suite from `sync-e2e-tests`, and neither
# declares the other as a path dependency.
[workspace]

[package]
name = "stoolap-node"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal Stoolap node binary for L4 cross-process E2E sync tests"

[[bin]]
name = "stoolap-node"
path = "src/main.rs"

[dependencies]
stoolap = { path = "/home/mmacedoeu/_w/databases/stoolap", features = ["sync"] }
octo-sync = { path = "/home/mmacedoeu/_w/ai/cipherocto/octo-sync" }
octo-network = { path = "/home/mmacedoeu/_w/ai/cipherocto/crates/octo-network" }
octo-transport = { path = "/home/mmacedoeu/_w/ai/cipherocto/octo-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
blake3 = "1"
serde_json = "1"

[patch."https://github.com/CipherOcto/cipherocto"]
octo-sync = { path = "/home/mmacedoeu/_w/ai/cipherocto/octo-sync" }
