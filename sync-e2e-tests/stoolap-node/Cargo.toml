[package]
name = "stoolap-node"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal Stoolap node binary for L4 cross-process E2E sync tests"

[[bin]]
name = "stoolap-node"
path = "src/main.rs"

[dependencies]
stoolap = { path = "/home/mmacedoeu/_w/databases/stoolap", features = ["sync"] }
octo-sync = { path = "/home/mmacedoeu/_w/ai/cipherocto/octo-sync" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

[patch."https://github.com/CipherOcto/cipherocto"]
octo-sync = { path = "/home/mmacedoeu/_w/ai/cipherocto/octo-sync" }
